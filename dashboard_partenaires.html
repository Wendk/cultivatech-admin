<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CultivaTech — Portail Partenaires</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --vert:#1A5319; --vert2:#36AF3B; --vert-pale:#D6EFD8; --vert-bg:#F4FAF4;
    --or:#C8A84B; --bg:#F0F4F0; --card:#FFFFFF;
    --border:#E4EDE4; --text:#1A2E1A; --muted:#6B8F6B;
    --red:#C0392B; --amber:#D68910; --blue:#2471A3; --purple:#7D3C98;
    --shadow:0 2px 8px rgba(26,83,25,.10),0 8px 32px rgba(26,83,25,.07);
    --shadow-lg:0 4px 24px rgba(26,83,25,.14),0 12px 48px rgba(26,83,25,.10);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

  /* ═══ LOGIN ═══ */
  #loginScreen{position:fixed;inset:0;z-index:1000;background:linear-gradient(145deg,#061206 0%,#0D2E0D 30%,#1A5319 65%,#0A3A1A 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .login-orbs{position:absolute;inset:0;pointer-events:none}
  .login-orbs::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(54,175,59,.12) 0%,transparent 70%);top:-100px;right:-100px}
  .login-orbs::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(200,168,75,.08) 0%,transparent 70%);bottom:-80px;left:-80px}
  .login-card{position:relative;background:rgba(255,255,255,.06);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:52px 48px;width:440px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.4)}
  .login-logo-wrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
  .login-logo{font-family:'Playfair Display',serif;font-size:28px;color:#fff;letter-spacing:-.5px}
  .login-leaf{font-size:28px}
  .login-sub{color:rgba(255,255,255,.4);font-size:12px;letter-spacing:.3px;margin-bottom:8px}
  .login-divider{width:40px;height:1px;background:rgba(54,175,59,.4);margin:16px auto 20px}
  .login-badge{display:inline-block;background:rgba(54,175,59,.18);border:1px solid rgba(54,175,59,.35);color:rgba(54,175,59,.9);font-size:10px;font-weight:600;padding:4px 14px;border-radius:20px;margin-bottom:28px;letter-spacing:.8px;text-transform:uppercase}
  .login-label{font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;text-align:left}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
  .role-btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px 8px;color:rgba(255,255,255,.5);font-size:12px;font-weight:500;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);font-family:'DM Sans',sans-serif;text-align:center}
  .role-btn:hover{background:rgba(54,175,59,.1);border-color:rgba(54,175,59,.4);color:rgba(255,255,255,.85);transform:translateY(-1px)}
  .role-btn.active{background:rgba(54,175,59,.18);border-color:rgba(54,175,59,.7);color:#fff;box-shadow:0 0 20px rgba(54,175,59,.2)}
  .role-icon{font-size:22px;display:block;margin-bottom:5px}
  .login-input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:14px 18px;color:#fff;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:10px;transition:all .2s;letter-spacing:.2px}
  .login-input::placeholder{color:rgba(255,255,255,.28)}
  .login-input:focus{border-color:rgba(54,175,59,.6);background:rgba(255,255,255,.09);box-shadow:0 0 0 3px rgba(54,175,59,.1)}
  .login-btn{width:100%;background:linear-gradient(135deg,#36AF3B 0%,#2d9e32 100%);border:none;border-radius:13px;padding:15px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .25s;margin-top:6px;letter-spacing:.3px;box-shadow:0 4px 20px rgba(54,175,59,.35)}
  .login-btn:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(54,175,59,.45)}
  .login-btn:disabled{opacity:.5;transform:none;cursor:not-allowed;box-shadow:none}
  .login-error{color:#ff8a80;font-size:12px;margin-top:10px;min-height:18px}

  /* ═══ APP ═══ */
  #app{display:none;min-height:100vh}

  /* ═══ TOPBAR ═══ */
  .topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:62px;padding:0 36px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 12px rgba(26,83,25,.08)}
  .topbar-left{display:flex;align-items:center;gap:14px}
  .topbar-logo{font-family:'Playfair Display',serif;font-size:19px;color:var(--vert);letter-spacing:-.3px}
  .topbar-sep{width:1px;height:22px;background:var(--border)}
  .topbar-role{display:inline-flex;align-items:center;gap:6px;padding:4px 13px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .badge-ong{background:linear-gradient(135deg,#E8F5E9,#C8E6C9);color:var(--vert);border:1px solid #A5D6A7}
  .badge-microfinance{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);color:var(--blue);border:1px solid #90CAF9}
  .topbar-name{font-size:13px;color:var(--muted);font-weight:500}
  .topbar-right{display:flex;align-items:center;gap:14px}
  .topbar-region{font-size:12px;color:var(--muted);background:var(--vert-bg);border:1px solid var(--border);padding:4px 10px;border-radius:20px}
  .refresh-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--muted);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;display:flex;align-items:center;gap:4px}
  .refresh-btn:hover{border-color:var(--vert2);color:var(--vert)}
  .logout-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 14px;color:var(--muted);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
  .logout-btn:hover{border-color:var(--red);color:var(--red);background:#fff5f5}

  /* ═══ TABS ═══ */
  .tab-bar{background:#fff;border-bottom:1px solid var(--border);padding:0 36px;display:flex;gap:4px}
  .tab-btn{background:none;border:none;border-bottom:3px solid transparent;padding:14px 18px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .tab-btn:hover{color:var(--text)}
  .tab-btn.active{color:var(--vert);border-bottom-color:var(--vert2);font-weight:600}

  /* ═══ CONTENT ═══ */
  .content{padding:36px;max-width:1360px;margin:0 auto}
  .page-header{margin-bottom:28px}
  .section-title{font-family:'Playfair Display',serif;font-size:24px;color:var(--vert);margin-bottom:5px}
  .section-sub{font-size:13px;color:var(--muted)}
  .subsection-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;margin:32px 0 14px;display:flex;align-items:center;gap:8px}
  .subsection-label::after{content:'';flex:1;height:1px;background:var(--border)}

  /* ═══ KPI CARDS ═══ */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:28px}
  .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:box-shadow .2s,transform .2s}
  .kpi-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
  .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--vert2);border-radius:3px 3px 0 0}
  .kpi-card.kpi-blue::before{background:var(--blue)}
  .kpi-card.kpi-amber::before{background:var(--amber)}
  .kpi-card.kpi-purple::before{background:var(--purple)}
  .kpi-card.kpi-red::before{background:var(--red)}
  .kpi-icon{font-size:24px;line-height:1}
  .kpi-value{font-size:30px;font-weight:700;color:var(--vert);letter-spacing:-1.5px;line-height:1}
  .kpi-label{font-size:12px;color:var(--muted);font-weight:500;line-height:1.3}
  .kpi-card.kpi-blue .kpi-value{color:var(--blue)}
  .kpi-card.kpi-amber .kpi-value{color:var(--amber)}
  .kpi-card.kpi-purple .kpi-value{color:var(--purple)}
  .kpi-card.kpi-red .kpi-value{color:var(--red)}

  /* ═══ CHARTS ═══ */
  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
  .charts-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:24px}
  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;box-shadow:var(--shadow)}
  .chart-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:18px;display:flex;align-items:center;gap:7px}
  .chart-wrap{position:relative;height:260px}

  /* ═══ ALERTE ═══ */
  .alerte-strip{background:linear-gradient(135deg,#FDECEA,#FDEDEA);border:1px solid #FADBD8;border-left:4px solid var(--red);border-radius:12px;padding:14px 18px;display:flex;align-items:flex-start;gap:12px;margin-bottom:22px}
  .alerte-strip .alerte-icon{font-size:20px;flex-shrink:0;margin-top:1px}
  .alerte-strip .alerte-title{font-weight:600;color:var(--red);font-size:13px;margin-bottom:3px}
  .alerte-strip .alerte-desc{font-size:12px;color:#922B21}
  .info-banner{background:linear-gradient(135deg,#F0F9F0,#EAF5EA);border:1px solid var(--vert-pale);border-left:4px solid var(--vert2);border-radius:12px;padding:14px 18px;font-size:13px;color:var(--vert);display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .warn-banner{background:linear-gradient(135deg,#FFF8E1,#FFF3CD);border:1px solid #FFE082;border-left:4px solid var(--amber);border-radius:12px;padding:13px 16px;font-size:12px;color:#7D6608;display:flex;align-items:center;gap:8px;margin-bottom:20px}

  /* ═══ TABLES ═══ */
  .table-card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:24px}
  .table-head{padding:16px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;background:linear-gradient(to right,#fff,#FAFCFA)}
  .table-title{font-size:14px;font-weight:600;color:var(--text)}
  .table-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .search-input{border:1px solid var(--border);border-radius:9px;padding:8px 13px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none;color:var(--text);width:200px;transition:all .2s;background:#FAFCFA}
  .search-input:focus{border-color:var(--vert2);box-shadow:0 0 0 3px rgba(54,175,59,.1);background:#fff}
  .filter-select{border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none;color:var(--text);background:#FAFCFA;cursor:pointer;transition:all .2s}
  .filter-select:focus{border-color:var(--vert2)}
  table{width:100%;border-collapse:collapse}
  th{background:var(--vert-bg);padding:10px 18px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  td{padding:12px 18px;font-size:13px;border-top:1px solid #F0F4F0}
  tr:hover td{background:#F8FBF8}
  .table-foot{padding:13px 22px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);background:var(--vert-bg)}
  .table-info{font-size:12px;color:var(--muted)}
  .pagination{display:flex;gap:4px}
  .page-btn{border:1px solid var(--border);border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer;background:#fff;font-family:'DM Sans',sans-serif;color:var(--text);transition:all .15s}
  .page-btn.active{background:var(--vert2);color:#fff;border-color:var(--vert2);font-weight:600}
  .page-btn:hover:not(.active){border-color:var(--vert2);color:var(--vert)}
  .page-btn:disabled{cursor:default;opacity:.4}

  /* ═══ BADGES ═══ */
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.2px}
  .b-green{background:#E8F5E9;color:#1B5E20}
  .b-amber{background:#FFF8E1;color:#E65100}
  .b-red{background:#FDECEA;color:#B71C1C}
  .b-blue{background:#E3F2FD;color:#0D47A1}
  .b-gray{background:#F5F5F5;color:#424242}
  .b-purple{background:#F3E5F5;color:#4A148C}

  /* ═══ SCORE BAR ═══ */
  .score-row{display:flex;align-items:center;gap:8px}
  .score-bar{height:7px;border-radius:4px;background:#EEF2EE;flex:1;overflow:hidden}
  .score-fill{height:100%;border-radius:4px;transition:width .5s ease}
  .score-num{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);min-width:34px;text-align:right}

  /* ═══ STATES ═══ */
  .loading{text-align:center;padding:80px;color:var(--muted)}
  .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--vert2);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty-state{text-align:center;padding:60px;color:var(--muted)}
  .empty-icon{font-size:42px;margin-bottom:14px}
  .btn-outline{background:none;border:1px solid var(--border);border-radius:9px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .2s;display:inline-flex;align-items:center;gap:5px}
  .btn-outline:hover{border-color:var(--vert2);color:var(--vert);background:var(--vert-bg)}
  .formation-prix{font-family:'DM Mono',monospace;font-size:12px;color:var(--vert);font-weight:600}

  /* ═══ STAT ROW (microfinance) ═══ */
  .stat-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F0F4F0}
  .stat-row:last-child{border-bottom:none}
  .stat-key{font-size:13px;color:var(--text)}
  .stat-val{font-family:'DM Mono',monospace;font-size:14px;font-weight:700;color:var(--vert)}

  @media(max-width:900px){.charts-grid,.charts-grid-3{grid-template-columns:1fr}}
  @media(max-width:768px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.content{padding:16px}.topbar{padding:0 16px}}
</style>
</head>
<body>

<!-- ═══════ LOGIN ═══════ -->
<div id="loginScreen">
  <div class="login-orbs"></div>
  <div class="login-card">
    <div class="login-logo-wrap">
      <span class="login-leaf">&#127807;</span>
      <span class="login-logo">CultivaTech</span>
    </div>
    <div class="login-sub">Agriculture intelligente au Burkina Faso</div>
    <div class="login-divider"></div>
    <div class="login-badge">Portail Partenaires</div>
    <div class="login-label">Votre organisation</div>
    <div class="role-grid">
      <button class="role-btn" data-role="ong" onclick="selectRole('ong')">
        <span class="role-icon">&#129309;</span>ONG
      </button>
      <button class="role-btn" data-role="microfinance" onclick="selectRole('microfinance')">
        <span class="role-icon">&#127970;</span>Microfinance
      </button>
    </div>
    <input class="login-input" id="username" type="text" placeholder="Identifiant" autocomplete="username">
    <input class="login-input" id="password" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="login-btn" id="loginBtn" onclick="doLogin()" disabled>Se connecter</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ═══════ APP ═══════ -->
<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">&#127807; CultivaTech</span>
      <div class="topbar-sep"></div>
      <span id="roleBadge" class="topbar-role"></span>
      <span id="topbarName" class="topbar-name"></span>
    </div>
    <div class="topbar-right">
      <span id="topbarRegion" class="topbar-region"></span>
      <button class="refresh-btn" onclick="fetchAndRender()">&#8635; Actualiser</button>
      <button class="logout-btn" onclick="logout()">D&#233;connexion</button>
    </div>
  </header>
  <nav class="tab-bar" id="tabBar"></nav>
  <main class="content" id="mainContent">
    <div class="loading"><div class="spinner"></div><div>Chargement&#8230;</div></div>
  </main>
</div>

<script>
var FUNCTIONS_URL = 'https://vyqhzagajlbosikzfnit.supabase.co/functions/v1'
var TOKEN        = sessionStorage.getItem('partner_token')
var USER         = JSON.parse(sessionStorage.getItem('partner_user') || 'null')
var DATA         = null
var CHARTS       = {}
var selectedRole = null
var currentTab   = null
var filteredRows = []
var currentPage  = 1
var PAGE_SIZE    = 15

if (TOKEN && USER) { showApp(); fetchAndRender() }

// ── LOGIN ────────────────────────────────────────────────────────────────────
function selectRole(role) {
  selectedRole = role
  document.querySelectorAll('.role-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.role === role) })
  document.getElementById('loginBtn').disabled = false
}

async function doLogin() {
  var username = document.getElementById('username').value.trim()
  var password = document.getElementById('password').value
  var errEl    = document.getElementById('loginError')
  errEl.textContent = ''
  if (!selectedRole) { errEl.textContent = 'S\xe9lectionnez un r\xf4le.'; return }
  if (!username || !password) { errEl.textContent = 'Identifiant et mot de passe requis.'; return }
  var btn = document.getElementById('loginBtn')
  btn.textContent = 'Connexion…'; btn.disabled = true
  try {
    var res  = await fetch(FUNCTIONS_URL + '/partner-login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:username,password:password,role:selectedRole}) })
    var data = await res.json()
    if (!res.ok) { errEl.textContent = data.error || 'Identifiants incorrects.'; btn.textContent = 'Se connecter'; btn.disabled = false; return }
    TOKEN = data.token; USER = data.user
    sessionStorage.setItem('partner_token', TOKEN)
    sessionStorage.setItem('partner_user', JSON.stringify(USER))
    showApp(); await fetchAndRender()
  } catch (_) { errEl.textContent = 'Erreur r\xe9seau.'; btn.textContent = 'Se connecter'; btn.disabled = false }
}

document.getElementById('username').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('password').focus() })
document.getElementById('password').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin() })

// ── APP ──────────────────────────────────────────────────────────────────────
var ROLE_TABS = { ong:['overview','terrain','formations','alertes','calendrier'], microfinance:['overview','credit','risque','simulateur'] }
var TAB_META  = { overview:{icon:'📊',label:"Vue d'ensemble"}, terrain:{icon:'🌾',label:'Terrain'}, formations:{icon:'🎓',label:'Formations'}, credit:{icon:'💳',label:'Cr\xe9dit agricole'}, alertes:{icon:'🚨',label:'Alertes & Risques'}, calendrier:{icon:'📅',label:'Calendrier cultural'}, risque:{icon:'📉',label:'Risque portefeuille'}, simulateur:{icon:'🧮',label:'Simulateur cr\xe9dit'} }

function showApp() {
  document.getElementById('loginScreen').style.display = 'none'
  document.getElementById('app').style.display = 'block'
  var badge = document.getElementById('roleBadge')
  badge.textContent = USER.role === 'ong' ? '🤝 ONG' : '🏦 Microfinance'
  badge.className = 'topbar-role ' + (USER.role === 'ong' ? 'badge-ong' : 'badge-microfinance')
  document.getElementById('topbarName').textContent = USER.name
  document.getElementById('topbarRegion').textContent = '📍 ' + (USER.region || 'National')
  buildTabBar()
}

function buildTabBar() {
  var bar  = document.getElementById('tabBar')
  bar.innerHTML = ''
  var tabs = ROLE_TABS[USER.role] || ['overview']
  tabs.forEach(function(t, i) {
    var btn = document.createElement('button')
    btn.className = 'tab-btn' + (i===0?' active':'')
    btn.dataset.tab = t
    btn.onclick = function(){ switchTab(t) }
    var m = TAB_META[t] || {icon:'•',label:t}
    btn.innerHTML = m.icon + ' ' + m.label
    bar.appendChild(btn)
  })
  currentTab = tabs[0]
}

function switchTab(tab) {
  currentTab = tab
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===tab) })
  if (DATA) { killCharts(); renderCurrentTab() }
}

// ── FETCH ────────────────────────────────────────────────────────────────────
async function fetchAndRender() {
  document.getElementById('mainContent').innerHTML = '<div class="loading"><div class="spinner"></div><div>Chargement des donn\xe9es…</div></div>'
  try {
    var res = await fetch(FUNCTIONS_URL + '/get-partner-stats', { headers:{'Authorization':'Bearer '+TOKEN} })
    if (res.status === 401) { logout(); return }
    if (!res.ok) throw new Error('HTTP ' + res.status)
    DATA = await res.json()
    killCharts(); renderCurrentTab()
  } catch (e) {
    document.getElementById('mainContent').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div style="margin-bottom:14px">Impossible de charger les donn\xe9es.<br><small style="color:var(--muted)">' + e.message + '</small></div><button onclick="fetchAndRender()" class="btn-outline" style="margin:0 auto">↺ R\xe9essayer</button></div>'
  }
}

function renderCurrentTab() {
  ({overview:renderOverview, terrain:renderTerrain, formations:renderFormations, credit:renderCredit, alertes:renderAlertes, calendrier:renderCalendrier, risque:renderRisqueMF, simulateur:renderSimulateur}[currentTab] || renderOverview)()
}

// ── CHARTS UTILS ─────────────────────────────────────────────────────────────
function killCharts() { Object.values(CHARTS).forEach(function(c){try{c.destroy()}catch(e){}}); CHARTS={} }

function mkChart(id, cfg) {
  var el = document.getElementById(id); if (!el) return null
  try { var ex = Chart.getChart(el); if(ex) ex.destroy() } catch(e){}
  CHARTS[id] = new Chart(el, cfg); return CHARTS[id]
}

function axisOpts(opt) {
  opt = opt || {}
  return { responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ display:opt.legend!==false, position:'bottom', labels:{font:{family:'DM Sans',size:12},boxWidth:12,padding:16} } },
    scales:{ x:{ stacked:!!opt.stacked, grid:{display:false}, ticks:{font:{family:'DM Sans',size:11}} }, y:{ stacked:!!opt.stacked, beginAtZero:true, max:opt.max, grid:{color:'#F0F4F0'}, ticks:{font:{family:'DM Sans',size:11}} } } }
}

function horzOpts(opt) {
  opt = opt || {}
  return { responsive:true, maintainAspectRatio:false, indexAxis:'y',
    plugins:{ legend:{ display:!!opt.legend } },
    scales:{ x:{ beginAtZero:true, max:opt.max, grid:{color:'#F0F4F0'}, ticks:{font:{family:'DM Sans',size:11}} }, y:{ grid:{display:false}, ticks:{font:{family:'DM Sans',size:11}} } } }
}

function donutOpts(opt) {
  opt = opt || {}
  return { plugins:{ legend:{ position:'bottom', labels:{font:{family:'DM Sans',size:12},boxWidth:12,padding:14} } }, cutout:opt.cutout||'58%', maintainAspectRatio:false, responsive:true }
}

function greenPalette(n) {
  var arr = []; for(var i=0;i<n;i++) arr.push('hsl('+(120+i*18)+','+(60-i*2)+'%,'+(38+i*3)+'%)'); return arr
}

function renderTerrain() {
  var ong      = DATA.ong || {}
  var scores   = ong.scores || {global:{},by_region:[]}
  var g        = scores.global || {}
  var regions  = (scores.by_region || []).slice(0, 12)
  var topC     = ong.top_cultures || []
  var vuln     = (ong.diagnostics && ong.diagnostics.vulnerabilite) || []
  var diagTotal = (ong.diagnostics && ong.diagnostics.total) || 0
  var kpis     = DATA.kpis || {}

  var html = '<div class="page-header"><h2 class="section-title">Terrain agricole</h2><p class="section-sub">Scores agricoles, cultures pratiqu\xe9es et sant\xe9 phytosanitaire</p></div>'

  html += '<div class="kpi-grid" style="grid-template-columns:repeat(5,1fr)">'
  html += kpiCard('', '&#128106;', g.total||null,         'B\xe9n\xe9ficiaires suivis')
  html += kpiCard('kpi-blue', '&#9989;', g.eligible||null,     '\xc9ligibles cr\xe9dit')
  html += kpiCard('', '&#11088;', g.total>0?g.moyenne:null, 'Score moyen agricole')
  html += kpiCard('kpi-amber', '&#127807;', kpis.productions||null, 'Productions enregistr\xe9es')
  html += kpiCard('kpi-purple', '&#128300;', diagTotal||null,     'Diagnostics cumul\xe9s')
  html += '</div>'

  // Scores régionaux
  html += '<div class="subsection-label">Scores et \xe9ligibilit\xe9 par r\xe9gion</div>'
  if (regions.length === 0) {
    html += '<div class="info-banner">&#128507; La r\xe9partition r\xe9gionale s\'activera d\xe8s que les agriculteurs autorisent la g\xe9olocalisation dans l\'app CultivaTech.</div>'
  } else {
    html += '<div class="charts-grid" style="margin-bottom:16px">'
    html += '<div class="chart-card"><div class="chart-title">Score moyen par r\xe9gion</div><div class="chart-wrap"><canvas id="cScoreReg"></canvas></div></div>'
    html += '<div class="chart-card"><div class="chart-title">Taux d\'\xe9ligibilit\xe9 cr\xe9dit (%)</div><div class="chart-wrap"><canvas id="cEligReg"></canvas></div></div>'
    html += '</div>'
    html += '<div class="table-card" style="margin-bottom:28px"><div class="table-head"><span class="table-title">D\xe9tail par r\xe9gion</span></div>'
    html += '<table><thead><tr><th>R\xe9gion</th><th>Agriculteurs</th><th>\xc9ligibles</th><th>Score moyen</th><th>Taux \xe9ligibilit\xe9</th></tr></thead><tbody>'
    regions.forEach(function(r) {
      var col = r.taux_eligible>=50?'var(--vert2)':r.taux_eligible>=25?'var(--amber)':'var(--red)'
      html += '<tr><td><strong>'+esc(r.region)+'</strong></td><td style="font-family:\'DM Mono\',monospace">'+r.total+'</td><td><span class="badge b-blue">'+r.eligible+'</span></td><td><strong style="font-family:\'DM Mono\',monospace">'+r.moyenne+'</strong></td><td><div class="score-row"><div class="score-bar"><div class="score-fill" style="width:'+r.taux_eligible+'%;background:'+col+'"></div></div><span class="score-num">'+r.taux_eligible+'%</span></div></td></tr>'
    })
    html += '</tbody></table></div>'
  }

  // Cultures
  html += '<div class="subsection-label">Cultures les plus pratiqu\xe9es</div>'
  if (topC.length === 0) {
    html += '<div class="info-banner">&#127807; Aucune production enregistr\xe9e pour le moment.</div>'
  } else {
    var totalP = topC.reduce(function(s,c){return s+c.total},0)||1
    html += '<div class="charts-grid" style="margin-bottom:16px">'
    html += '<div class="chart-card"><div class="chart-title">Volumes par culture</div><div class="chart-wrap"><canvas id="cCultsOng"></canvas></div></div>'
    html += '<div class="chart-card"><div class="chart-title">Part relative (top 6)</div><div class="chart-wrap"><canvas id="cCultDonut"></canvas></div></div>'
    html += '</div>'
    html += '<div class="table-card" style="margin-bottom:28px"><div class="table-head"><span class="table-title">D\xe9tail — '+topC.length+' cultures</span></div>'
    html += '<table><thead><tr><th>#</th><th>Culture</th><th>Productions</th><th>Part</th></tr></thead><tbody>'
    topC.forEach(function(c,i) {
      var pct = Math.round(c.total/totalP*100)
      html += '<tr><td style="color:var(--muted);font-size:12px">'+(i+1)+'</td><td><strong>'+esc(c.name)+'</strong></td><td style="font-family:\'DM Mono\',monospace;font-weight:700">'+c.total+'</td><td><div class="score-row"><div class="score-bar"><div class="score-fill" style="width:'+pct+'%;background:var(--vert2)"></div></div><span class="score-num">'+pct+'%</span></div></td></tr>'
    })
    html += '</tbody></table></div>'
  }

  // Vulnérabilité
  html += '<div class="subsection-label">Sant\xe9 phytosanitaire</div>'
  if (diagTotal === 0) {
    html += '<div class="info-banner">&#128737;&#65039; Aucun diagnostic effectu\xe9 pour le moment.</div>'
  } else if (vuln.length === 0) {
    html += '<div class="info-banner">&#9989; Aucune maladie identifi\xe9e dans les '+diagTotal+' diagnostics enregistr\xe9s.</div>'
  } else {
    var urgHigh = vuln.filter(function(v){return v.urgency==='\xc9lev\xe9e'})
    if (urgHigh.length > 0) {
      html += '<div class="alerte-strip"><div class="alerte-icon">&#128680;</div><div><div class="alerte-title">'+urgHigh.length+' maladie'+(urgHigh.length>1?'s':'')+' \xe0 urgence \xe9lev\xe9e — intervention recommand\xe9e</div><div class="alerte-desc">'+urgHigh.slice(0,3).map(function(v){return v.name}).join(', ')+'</div></div></div>'
    }
    html += '<div class="charts-grid" style="margin-bottom:16px">'
    html += '<div class="chart-card"><div class="chart-title">Top maladies / ravageurs</div><div class="chart-wrap"><canvas id="cVulnBar"></canvas></div></div>'
    html += '<div class="chart-card"><div class="chart-title">R\xe9partition par niveau d\'urgence</div><div class="chart-wrap"><canvas id="cVulnUrg"></canvas></div></div>'
    html += '</div>'
    html += '<div class="table-card"><div class="table-head"><span class="table-title">D\xe9tail des menaces ('+vuln.length+')</span></div>'
    html += '<table><thead><tr><th>#</th><th>Maladie / Ravageur</th><th>Cas</th><th>Urgence</th><th>Cultures touch\xe9es</th></tr></thead><tbody>'
    vuln.forEach(function(m,i){
      html += '<tr><td style="color:var(--muted);font-size:12px">'+(i+1)+'</td><td><strong>'+esc(m.name)+'</strong></td><td style="font-family:\'DM Mono\',monospace;font-weight:700">'+m.count+'</td><td>'+urgBadge(m.urgency)+'</td><td style="font-size:12px;color:var(--muted)">'+((m.cultures||[]).join(', ')||'—')+'</td></tr>'
    })
    html += '</tbody></table></div>'
  }

  document.getElementById('mainContent').innerHTML = html

  setTimeout(function() {
    if (regions.length) {
      mkChart('cScoreReg', { type:'bar', data:{ labels:regions.map(function(r){return r.region}), datasets:[{label:'Score',data:regions.map(function(r){return r.moyenne}),backgroundColor:'#36AF3B',borderRadius:7}] }, options:axisOpts({legend:false}) })
      mkChart('cEligReg',  { type:'bar', data:{ labels:regions.map(function(r){return r.region}), datasets:[{label:'%',data:regions.map(function(r){return r.taux_eligible}),backgroundColor:'#2471A3',borderRadius:7}] }, options:axisOpts({max:100,legend:false}) })
    }
    if (topC.length) {
      mkChart('cCultsOng',  { type:'bar', data:{ labels:topC.map(function(c){return c.name}), datasets:[{label:'Productions',data:topC.map(function(c){return c.total}),backgroundColor:greenPalette(topC.length),borderRadius:7}] }, options:axisOpts({legend:false}) })
      mkChart('cCultDonut', { type:'doughnut', data:{ labels:topC.slice(0,6).map(function(c){return c.name}), datasets:[{data:topC.slice(0,6).map(function(c){return c.total}),backgroundColor:greenPalette(6),borderWidth:2,borderColor:'#fff'}] }, options:donutOpts() })
    }
    if (vuln.length) {
      var top8 = vuln.slice(0,8)
      mkChart('cVulnBar', { type:'bar', data:{ labels:top8.map(function(m){return m.name.length>22?m.name.slice(0,22)+'…':m.name}), datasets:[{data:top8.map(function(m){return m.count}),backgroundColor:top8.map(function(m){return URGCOL[m.urgency]||'#aaa'}),borderRadius:6}] }, options:horzOpts() })
      var urgMap = {}; vuln.forEach(function(m){var k=m.urgency||'Inconnue';urgMap[k]=(urgMap[k]||0)+m.count})
      mkChart('cVulnUrg', { type:'doughnut', data:{ labels:Object.keys(urgMap), datasets:[{data:Object.values(urgMap),backgroundColor:Object.keys(urgMap).map(function(k){return URGCOL[k]||'#aaa'}),borderWidth:2,borderColor:'#fff'}] }, options:donutOpts() })
    }
  }, 80)
}

function filterFormations() {
  var q    = (document.getElementById('searchFormations')||{value:''}).value.toLowerCase()
  var cat  = (document.getElementById('filterCateg')||{value:''}).value
  var grat = (document.getElementById('filterGrat')||{value:''}).value
  var all  = ((DATA.ong && DATA.ong.trainings && DATA.ong.trainings.list)||[])
  filteredRows = all.filter(function(t) {
    var mQ = !q||(t.title||'').toLowerCase().includes(q)||(t.organisme||'').toLowerCase().includes(q)||(t.ville||'').toLowerCase().includes(q)
    var mC = !cat||t.categorie===cat
    var mG = !grat||(grat==='free'&&t.is_free)||(grat==='paid'&&!t.is_free)
    return mQ&&mC&&mG
  })
  currentPage=1; renderFormationsTable()
}

function renderFormationsTable() {
  var total = filteredRows.length, pages = Math.ceil(total/PAGE_SIZE)||1
  currentPage = Math.min(currentPage, pages)
  var slice = filteredRows.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE)
  var body  = document.getElementById('formationsBody'); if(!body) return
  body.innerHTML = slice.length===0
    ? '<tr><td colspan="8" style="text-align:center;padding:28px;color:var(--muted)">Aucun r\xe9sultat</td></tr>'
    : slice.map(function(t,i) {
        var idx   = (currentPage-1)*PAGE_SIZE+i+1
        var prix  = t.is_free ? '<span class="badge b-green">Gratuite</span>' : (t.prix ? '<span class="formation-prix">'+fmtN(t.prix)+' FCFA</span>' : '<span style="color:var(--muted)">N/A</span>')
        var cert  = t.is_certifiante ? '<span class="badge b-purple">&#127941; Oui</span>' : '<span style="color:var(--muted);font-size:12px">—</span>'
        var debut = t.date_debut ? new Date(t.date_debut).toLocaleDateString('fr-FR') : '—'
        return '<tr><td style="color:var(--muted);font-size:12px">'+idx+'</td><td><strong>'+esc(t.title||'')+'</strong></td><td style="font-size:12px;color:var(--muted)">'+esc(t.organisme||'—')+'</td><td><span class="badge b-blue">'+esc(t.ville||'—')+'</span></td><td style="font-size:12px">'+esc(t.categorie||'—')+'</td><td>'+prix+'</td><td>'+cert+'</td><td style="font-family:\'DM Mono\',monospace;font-size:12px">'+debut+'</td></tr>'
      }).join('')
  document.getElementById('fInfo').textContent = total+' formation'+(total>1?'s':'')+' — page '+currentPage+'/'+pages
  buildPagination('fPag', pages, 'formations')
}

function filterCredit() {
  var q      = (document.getElementById('searchCredit')||{value:''}).value.toLowerCase()
  var statut = (document.getElementById('filterStatut')||{value:''}).value
  var region = (document.getElementById('filterRegion')||{value:''}).value
  var all    = (DATA.microfinance && DATA.microfinance.users) || []
  filteredRows = all.filter(function(u) {
    var name = ((u.first_name||'')+' '+(u.last_name||'')).toLowerCase()
    return (!q||name.includes(q)||(u.phone_number||'').includes(q)) && (!statut||u.statut===statut) && (!region||u.region===region)
  })
  currentPage=1; renderCreditTable()
}

function renderCreditTable() {
  var total = filteredRows.length, pages = Math.ceil(total/PAGE_SIZE)||1
  currentPage = Math.min(currentPage, pages)
  var slice = filteredRows.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE)
  var body  = document.getElementById('creditBody'); if(!body) return
  body.innerHTML = slice.length===0
    ? '<tr><td colspan="8" style="text-align:center;padding:28px;color:var(--muted)">Aucun r\xe9sultat</td></tr>'
    : slice.map(function(u,i) {
        var idx = (currentPage-1)*PAGE_SIZE+i+1
        var sc  = u.score || 0
        var bar = Math.min(sc, 100)
        var col = sc>=61?'var(--vert2)':sc>=41?'var(--amber)':'var(--red)'
        return '<tr><td style="color:var(--muted);font-size:12px">'+idx+'</td><td><strong>'+esc((u.first_name||'')+' '+(u.last_name||''))+'</strong></td><td style="font-family:\'DM Mono\',monospace;font-size:12px">'+esc(u.phone_number||'—')+'</td><td><div class="score-row"><div class="score-bar"><div class="score-fill" style="width:'+bar+'%;background:'+col+'"></div></div><span class="score-num">'+sc+'</span></div></td><td>'+statutBadge(u.statut)+'</td><td style="font-size:12px;color:var(--muted)">'+esc(u.region||'—')+'</td><td style="font-size:12px;color:var(--muted)">'+esc(u.province||'—')+'</td><td style="font-size:12px;color:var(--muted)">'+fmtYear(u.date_inscription)+'</td></tr>'
      }).join('')
  var inf = document.getElementById('tblInfo'); if(inf) inf.textContent=total+' dossier'+(total>1?'s':'')+' — page '+currentPage+'/'+pages
  buildPagination('tblPag', pages, 'credit')
}

function exportCSV() {
  var rows = (DATA.microfinance && DATA.microfinance.users) || []
  var BOM  = '﻿'
  var HDR  = ['Pr\xe9nom','Nom','T\xe9l\xe9phone','Score','Statut','R\xe9gion','Province','Inscription']
  var csv  = BOM + [HDR].concat(rows.map(function(u){return [u.first_name,u.last_name,u.phone_number,u.score,u.statut,u.region,u.province,u.date_inscription?new Date(u.date_inscription).toLocaleDateString('fr-FR'):''];})).map(function(r){return r.map(function(v){return '"'+String(v||'').replace(/"/g,'""')+'"'}).join(';')}).join('\n')
  var a = document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='cultivatech_credit_'+new Date().toISOString().slice(0,10)+'.csv'; a.click()
}

  // Calendrier mensuel

// MICROFINANCE — RISQUE PORTEFEUILLE

function renderRisqueMF() {
  var mf    = DATA.microfinance || {}
  var users = mf.users || []
  var vuln  = (DATA.ong && DATA.ong.diagnostics && DATA.ong.diagnostics.vulnerabilite) || []
  var mi    = new Date().getMonth()
  var mc    = BFA_CALENDAR[mi]
  var urgHigh = vuln.filter(function(v){return v.urgency==='\xc9lev\xe9e'})
  var urgMed  = vuln.filter(function(v){return v.urgency==='Mod\xe9r\xe9e'})

  var nElig  = users.filter(function(u){return u.statut==='\xc9ligible cr\xe9dit'}).length
  var nRisk  = users.filter(function(u){return u.statut==='Insuffisant'}).length
  var nEval  = users.filter(function(u){return u.statut==='\xc0 \xe9valuer'}).length
  var nTotal = users.length

  var html = '<div class="page-header"><h2 class="section-title">📉 Risque portefeuille</h2><p class="section-sub">Analyse de risque bas\xe9e sur le terrain — aide \xe0 la d\xe9cision cr\xe9dit</p></div>'

  // KPI risques
  html += '<div class="kpi-grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:24px">'
  html += kpiCard('','✅',nElig,'Dossiers sains')
  html += kpiCard('kpi-amber','⏳',nEval,'\xc0 r\xe9\xe9valuer')
  html += kpiCard('kpi-red','⚠️',nRisk,'Risque de d\xe9faut')
  html += kpiCard(urgHigh.length>=2?'kpi-red':'kpi-amber','🔬',urgHigh.length+urgMed.length,'Menaces phyto actives')
  html += kpiCard(mc.soudure?'kpi-amber':'','📅',null,mc.soudure?'⚠️ P\xe9riode soudure':'Saison stable')
  html += '</div>'

  // Alertes contextuelles
  if (mc.soudure) html += '<div class="alerte-strip"><div class="alerte-icon">📅</div><div><div class="alerte-title">P\xe9riode de soudure — Risque de d\xe9faut accru</div><div class="alerte-desc">Les emprunteurs dont les cultures ne sont pas encore r\xe9colt\xe9es sont en tension financi\xe8re. Recommandations : gel des p\xe9nalit\xe9s, r\xe9\xe9chelonnement pr\xe9ventif pour les comptes fragiles, visite terrain prioritaire.</div></div></div>'
  if (urgHigh.length > 0) html += '<div class="alerte-strip"><div class="alerte-icon">🔬</div><div><div class="alerte-title">Risque phytosanitaire — Impact potentiel sur les remboursements</div><div class="alerte-desc">'+urgHigh.length+' maladie(s) \xe0 urgence \xe9lev\xe9e : '+esc(urgHigh.slice(0,3).map(function(v){return v.name}).join(', '))+'. Les emprunteurs cultivant ces esp\xe8ces peuvent subir des pertes. Identifier le portefeuille expos\xe9 et pr\xe9voir des mesures de g\xe9n\xe9rosit\xe9.</div></div></div>'

  // Exposition par région
  html += '<div class="subsection-label">Exposition par r\xe9gion — Risque cr\xe9dit crois\xe9 avec donn\xe9es SP/CONASUR</div>'
  var regMap = {}
  users.forEach(function(u){
    var r=u.region||'Non renseign\xe9e'
    if(!regMap[r]) regMap[r]={total:0,elig:0,risk:0,eval:0,scores:[]}
    regMap[r].total++; regMap[r].scores.push(u.score||0)
    if(u.statut==='\xc9ligible cr\xe9dit') regMap[r].elig++
    else if(u.statut==='Insuffisant') regMap[r].risk++
    else regMap[r].eval++
  })
  var regList = Object.entries(regMap).sort(function(a,b){return b[1].total-a[1].total})
  html += '<div class="table-card" style="margin-bottom:8px"><table>'
  html += '<thead><tr><th>R\xe9gion</th><th>Dossiers</th><th>\xc9ligibles</th><th>Risque d\xe9faut</th><th>Score moy.</th><th>Statut officiel</th><th>PDI (SP/CONASUR)</th></tr></thead><tbody>'

    var r=e[0],d=e[1]

    var pRisk=d.total?Math.round(d.risk/d.total*100):0

  })
  html += '</tbody></table></div>'
  html += '<div style="font-size:10px;color:var(--muted);padding:6px 10px;margin-bottom:20px">📋 Sources : Statut sécuritaire — Décret n°2023-1027/TPMA/CAB (JO du Faso) &amp; SP/CONASUR. PDI — SP/CONASUR, Rapport de Situation PDI, Déc. 2023. Les infobulles (hover) affichent la source précise par région.</div>'

  // Calendrier de crédit optimal
  html += '<div class="subsection-label">Fen\xeatre de d\xe9caissement optimale par fili\xe8re</div>'
  html += '<div class="table-card" style="margin-bottom:24px"><table>'
  html += '<thead><tr><th>Culture</th><th>D\xe9caissement optimal</th><th>Remboursement</th><th>Dur\xe9e</th><th>Taux recommand\xe9</th><th>Niveau de risque</th></tr></thead><tbody>'
  CREDIT_CALENDAR.forEach(function(c){
    var isOpen = c.dec.split('–').some(function(m){ var idx=['Jan','F\xe9v','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','D\xe9c'].findIndex(function(x){return m.trim().toLowerCase().startsWith(x.toLowerCase())}); return idx===-1?false:idx===mi||idx===(mi+1)%12 })
    html += '<tr style="'+(isOpen?'background:rgba(54,175,59,.04)':'')+'">'
    html += '<td><strong>'+c.icon+' '+esc(c.culture)+'</strong>'+(isOpen?' <span class="badge b-green" style="font-size:9px">Fen\xeatre ouverte</span>':'')+'</td>'
    html += '<td style="font-size:12px">'+esc(c.dec)+'</td>'
    html += '<td style="font-size:12px">'+esc(c.remb)+'</td>'
    html += '<td style="font-family:\'DM Mono\',monospace">'+c.duree+' mois</td>'
    html += '<td style="font-family:\'DM Mono\',monospace;color:var(--vert);font-weight:700">'+c.taux+'% / an</td>'
    html += '<td><span class="badge '+(c.risque.includes('Faible')?'b-green':c.risque.includes('lev')?'b-red':'b-amber')+'">'+esc(c.risque)+'</span></td>'
    html += '</tr>'
  })
  html += '</tbody></table></div>'

  document.getElementById('mainContent').innerHTML = html
}

// ════════════════════════════════════════════════════════════════════════════
// MICROFINANCE — SIMULATEUR DE CRÉDIT
// ════════════════════════════════════════════════════════════════════════════
function renderSimulateur() {
  var html = '<div class="page-header"><h2 class="section-title">🧮 Simulateur de cr\xe9dit agricole</h2><p class="section-sub">Calcul du montant \xe9ligible bas\xe9 sur le profil de l\'agriculteur</p></div>'
  html += '<div class="warn-banner">📌 <strong>Outil d\'aide \xe0 la d\xe9cision</strong> — R\xe9sultats indicatifs. Validation obligatoire par un agent de cr\xe9dit terrain.</div>'
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start">'

  // Formulaire
  html += '<div class="chart-card">'
  html += '<div class="chart-title">📋 Param\xe8tres du dossier</div>'
  html += field('Score agricole CultivaTech','<input type="range" id="simScore" min="0" max="100" value="60" oninput="calcSim()" style="width:100%;accent-color:var(--vert2)"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)"><span>0 (Insuffisant)</span><span id="simScoreVal" style="font-weight:700;color:var(--vert);font-size:15px">60</span><span>100 (Excellent)</span></div>')
  html += field('Culture principale','<select id="simCulture" class="filter-select" style="width:100%;padding:10px" onchange="calcSim()">'+CREDIT_CALENDAR.map(function(c){return '<option value="'+esc(c.culture)+'">'+c.icon+' '+esc(c.culture)+'</option>'}).join('')+'</select>')
  html += field('Surface cultiv\xe9e (hectares)','<input type="number" id="simSurface" min="0.5" max="100" step="0.5" value="2" oninput="calcSim()" class="search-input" style="width:100%;padding:10px">')
  html += field('Historique de remboursement','<select id="simHisto" class="filter-select" style="width:100%;padding:10px" onchange="calcSim()"><option value="1.25">Excellent — jamais de retard</option><option value="1.0" selected>Bon — quelques retards mineurs</option><option value="0.75">Moyen — retards fr\xe9quents</option><option value="0.5">Insuffisant — incidents de paiement</option></select>')
  html += field('R\xe9gion (risque s\xe9curitaire)','<select id="simRegion" class="filter-select" style="width:100%;padding:10px" onchange="calcSim()"><option value="1.0">Zone stable</option>'+Object.entries(SECURITY_ZONES).map(function(e){var m={critique:0.6,eleve:0.75,modere:0.9}[e[1].level]||0.9;return'<option value="'+m+'">'+esc(e[0])+' ('+esc(e[1].label)+')</option>'}).join('')+'</select>')
  html += '</div>'

  // Résultats
  html += '<div>'
  html += '<div class="chart-card" id="simResult" style="margin-bottom:16px;background:linear-gradient(135deg,#F4FAF4,#EAF5EA);border:2px solid var(--vert-pale)">'
  html += '<div class="chart-title">📈 R\xe9sultat de l\'analyse</div>'
  html += '<div id="simResultContent"></div></div>'
  html += '<div class="chart-card" id="simPlanCard">'
  html += '<div class="chart-title">📅 \xc9ch\xe9ancier de remboursement</div>'
  html += '<div id="simPlanContent"></div></div>'
  html += '</div>'
  html += '</div>'

  document.getElementById('mainContent').innerHTML = html
  calcSim()
}

function field(label, content) {
  return '<div style="margin-bottom:16px"><label style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:7px">'+esc(label)+'</label>'+content+'</div>'
}

function calcSim() {
  var score   = parseInt((document.getElementById('simScore')||{value:60}).value)||0
  var culture = (document.getElementById('simCulture')||{value:'Mil / Sorgho'}).value
  var surface = parseFloat((document.getElementById('simSurface')||{value:2}).value)||1
  var histo   = parseFloat((document.getElementById('simHisto')||{value:1}).value)||1
  var regM    = parseFloat((document.getElementById('simRegion')||{value:1}).value)||1
  var sv = document.getElementById('simScoreVal'); if(sv) sv.textContent=score

  var cd = CREDIT_CALENDAR.find(function(c){return c.culture===culture})||CREDIT_CALENDAR[0]
  var eligible        = score >= 61
  var eligiblePartiel = score >= 41 && score < 61
  var rc = document.getElementById('simResultContent')
  var pc = document.getElementById('simPlanContent')
  if (!rc) return

  if (!eligible && !eligiblePartiel) {
    rc.innerHTML='<div style="background:#FDECEA;border-radius:10px;padding:16px"><strong style="color:#922B21">❌ Score insuffisant ('+score+'/100)</strong><br><span style="font-size:12px;color:#922B21;margin-top:6px;display:block">Score minimum requis : 41/100 pour l\'acc\xe8s partiel.<br>Recommander un programme de renforcement (formations, suivi) avant r\xe9\xe9valuation dans 6 mois.</span></div>'
    if(pc) pc.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">—</div>'
    return
  }

  var scoreMulti = 0.4 + (score/100)*0.9
  var montant    = Math.round(cd.basePha * surface * scoreMulti * histo * regM / 5000)*5000
  var mntMin     = Math.round(montant*0.75/5000)*5000
  var mntMax     = Math.round(montant*1.20/5000)*5000
  var taux       = cd.taux, duree = cd.duree
  var tauxM      = taux/12/100
  var mensualite = tauxM>0 ? Math.round(montant*tauxM*Math.pow(1+tauxM,duree)/(Math.pow(1+tauxM,duree)-1)/1000)*1000 : Math.round(montant/duree/1000)*1000
  var totalR     = mensualite*duree
  var interets   = totalR-montant

  var statusHtml = eligible
    ? '<div style="background:#E8F5E9;border-radius:10px;padding:12px 16px;margin-bottom:14px"><strong style="color:#1B5E20">✅ \xc9LIGIBLE AU CR\xc9DIT — score '+score+'/100</strong></div>'
    : '<div style="background:#FFF8E1;border-radius:10px;padding:12px 16px;margin-bottom:14px"><strong style="color:#7D6608">⚠️ \xc9LIGIBLE PARTIEL — accord conditionnel ('+score+'/100)</strong><br><span style="font-size:11px;color:#7D6608">Suivi renforc\xe9 recommand\xe9 — montant plafonn\xe9</span></div>'

  rc.innerHTML = statusHtml
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">'
    + '<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center"><div style="font-size:11px;color:var(--muted);margin-bottom:4px">Montant recommand\xe9</div><div style="font-size:24px;font-weight:700;color:var(--vert);font-family:\'DM Mono\',monospace">'+Number(montant).toLocaleString('fr-FR')+'</div><div style="font-size:10px;color:var(--muted)">FCFA (fourchette : '+Number(mntMin).toLocaleString('fr-FR')+'–'+Number(mntMax).toLocaleString('fr-FR')+')</div></div>'
    + '<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center"><div style="font-size:11px;color:var(--muted);margin-bottom:4px">Mensualit\xe9 estim\xe9e</div><div style="font-size:24px;font-weight:700;color:var(--blue);font-family:\'DM Mono\',monospace">'+Number(mensualite).toLocaleString('fr-FR')+'</div><div style="font-size:10px;color:var(--muted)">FCFA / mois sur '+duree+' mois \xe0 '+taux+'% / an</div></div>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">'
    + '<div><div style="font-size:10px;color:var(--muted)">Total rembours\xe9</div><div style="font-weight:700;font-family:\'DM Mono\',monospace;font-size:12px">'+Number(totalR).toLocaleString('fr-FR')+' FCFA</div></div>'
    + '<div><div style="font-size:10px;color:var(--muted)">Coût du cr\xe9dit</div><div style="font-weight:700;font-family:\'DM Mono\',monospace;font-size:12px;color:var(--amber)">'+Number(interets).toLocaleString('fr-FR')+' FCFA</div></div>'
    + '<div><div style="font-size:10px;color:var(--muted)">Culture financ\xe9e</div><div style="font-weight:700;font-size:13px">'+cd.icon+' '+esc(culture)+'</div></div>'
    + '</div>'

  // Échéancier
  var now=new Date(), solde=montant, rows=''
  for(var m=0;m<Math.min(duree,8);m++){
    var dm=new Date(now.getFullYear(),now.getMonth()+m+1,1)
    var intM=Math.round(solde*tauxM), capM=mensualite-intM
    solde=Math.max(0,solde-capM)
    rows+='<tr><td style="padding:6px 10px;font-size:11px;border-top:1px solid #f0f4f0">'+dm.toLocaleDateString('fr-FR',{month:'short',year:'numeric'})+'</td>'
    +'<td style="padding:6px 10px;font-size:11px;font-family:\'DM Mono\',monospace;text-align:right;border-top:1px solid #f0f4f0">'+Number(mensualite).toLocaleString('fr-FR')+'</td>'
    +'<td style="padding:6px 10px;font-size:11px;text-align:right;color:var(--amber);font-family:\'DM Mono\',monospace;border-top:1px solid #f0f4f0">'+Number(intM).toLocaleString('fr-FR')+'</td>'
    +'<td style="padding:6px 10px;font-size:11px;text-align:right;color:var(--muted);font-family:\'DM Mono\',monospace;border-top:1px solid #f0f4f0">'+Number(Math.round(solde/1000)*1000).toLocaleString('fr-FR')+'</td></tr>'
  }
  if(duree>8) rows+='<tr><td colspan="4" style="padding:6px 10px;text-align:center;font-size:11px;color:var(--muted);border-top:1px solid #f0f4f0">… '+(duree-8)+' mois suppl\xe9mentaires</td></tr>'
  if(pc) pc.innerHTML='<table style="width:100%;border-collapse:collapse"><thead><tr><th style="background:var(--vert-bg);font-size:10px;color:var(--muted);padding:7px 10px;text-align:left">Mois</th><th style="background:var(--vert-bg);font-size:10px;color:var(--muted);padding:7px 10px;text-align:right">Mensualit\xe9</th><th style="background:var(--vert-bg);font-size:10px;color:var(--muted);padding:7px 10px;text-align:right">Int\xe9r\xeats</th><th style="background:var(--vert-bg);font-size:10px;color:var(--muted);padding:7px 10px;text-align:right">Solde</th></tr></thead><tbody>'+rows+'</tbody></table>'
}

// ── PAGINATION ───────────────────────────────────────────────────────────────
function buildPagination(cid, pages, ctx) {
  var pag = document.getElementById(cid); if(!pag) return; pag.innerHTML=''
  if(currentPage>1) addPageBtn(pag,'‹',currentPage-1,false,ctx)
  for(var p=Math.max(1,currentPage-2);p<=Math.min(pages,currentPage+2);p++) addPageBtn(pag,p,p,p===currentPage,ctx)
  if(currentPage<pages) addPageBtn(pag,'›',currentPage+1,false,ctx)
}

function addPageBtn(container, label, page, active, ctx) {
  var b = document.createElement('button'); b.className='page-btn'+(active?' active':''); b.textContent=label
  var p=page; b.onclick=function(){currentPage=p;if(ctx==='formations')renderFormationsTable();else renderCreditTable()}
  if(active) b.disabled=true; container.appendChild(b)
}

// ── LOGOUT ───────────────────────────────────────────────────────────────────
function logout() {
  sessionStorage.removeItem('partner_token'); sessionStorage.removeItem('partner_user')
  TOKEN=null; USER=null; DATA=null; killCharts()
  document.getElementById('loginScreen').style.display='flex'
  document.getElementById('app').style.display='none'
  document.getElementById('loginBtn').disabled=true
  document.getElementById('username').value=''; document.getElementById('password').value=''
  document.getElementById('loginError').textContent=''
  document.querySelectorAll('.role-btn').forEach(function(b){b.classList.remove('active')}); selectedRole=null
}

// ── UTILS ────────────────────────────────────────────────────────────────────
function fmtN(n)     { return n!=null ? Number(n).toLocaleString('fr-FR') : '—' }
function fmtDate(iso){ return iso ? new Date(iso).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}) : '—' }
function fmtYear(iso){ return iso ? new Date(iso).getFullYear() : '—' }
function esc(s)      { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function kpiCard(cls, icon, val, label, suffix) {
  var display = (val===null||val===undefined||val===''||val===0&&label.includes('Score'))?'—':fmtN(val)+(suffix||'')
  if (val === 0 && !label.includes('Score')) display = '0'
  return '<div class="kpi-card '+(cls||'')+'"><div class="kpi-icon">'+icon+'</div><div class="kpi-value">'+display+'</div><div class="kpi-label">'+label+'</div></div>'
}

function urgBadge(u) {
  var m={'\xc9lev\xe9e':'b-red','Mod\xe9r\xe9e':'b-amber','Faible':'b-green'}
  return '<span class="badge '+(m[u]||'b-gray')+'">'+esc(u||'—')+'</span>'
}

function statutBadge(s) {
  var m={'\xc9ligible cr\xe9dit':'b-green','\xc0 \xe9valuer':'b-amber','Insuffisant':'b-red'}
  return '<span class="badge '+(m[s]||'b-gray')+'">'+esc(s||'Non \xe9valu\xe9')+'</span>'
}
