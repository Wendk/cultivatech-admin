<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CultivaTech — Portail Partenaires</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --vert:#1A5319; --vert2:#36AF3B; --vert-pale:#D6EFD8; --vert-bg:#F4FAF4;
    --or:#C8A84B; --bg:#F8FAF8; --card:#FFFFFF;
    --border:#E4EDE4; --text:#1A2E1A; --muted:#6B8F6B;
    --red:#C0392B; --amber:#D68910; --blue:#2471A3; --purple:#7D3C98;
    --shadow:0 1px 3px rgba(26,83,25,.08),0 4px 16px rgba(26,83,25,.06);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

  /* ── LOGIN ── */
  #loginScreen{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#0D1F0D 0%,#1A5319 40%,#024B2A 100%);display:flex;align-items:center;justify-content:center}
  .login-dots{position:absolute;inset:0;opacity:.04;background-image:radial-gradient(circle at 2px 2px,#fff 1px,transparent 0);background-size:28px 28px}
  .login-card{position:relative;background:rgba(255,255,255,.07);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:48px 44px;width:420px;text-align:center}
  .login-logo{font-family:'Playfair Display',serif;font-size:30px;color:#fff;letter-spacing:-.5px}
  .login-sub{color:rgba(255,255,255,.45);font-size:12px;margin:4px 0 6px}
  .login-badge{display:inline-block;background:rgba(54,175,59,.2);border:1px solid rgba(54,175,59,.4);color:var(--vert2);font-size:10px;font-weight:600;padding:3px 12px;border-radius:20px;margin-bottom:28px;letter-spacing:.6px;text-transform:uppercase}
  .role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
  .role-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 6px;color:rgba(255,255,255,.55);font-size:11px;font-weight:500;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;text-align:center}
  .role-btn:hover{border-color:rgba(54,175,59,.5);color:var(--vert2)}
  .role-btn.active{background:rgba(54,175,59,.15);border-color:var(--vert2);color:var(--vert2)}
  .role-icon{font-size:20px;display:block;margin-bottom:4px}
  .login-input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:13px 16px;color:#fff;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:10px;transition:border .2s}
  .login-input::placeholder{color:rgba(255,255,255,.3)}
  .login-input:focus{border-color:var(--vert2)}
  .login-btn{width:100%;background:var(--vert2);border:none;border-radius:12px;padding:14px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;margin-top:4px}
  .login-btn:hover{background:#2d9e32;transform:translateY(-1px)}
  .login-btn:disabled{opacity:.6;transform:none;cursor:not-allowed}
  .login-error{color:#ff7675;font-size:12px;margin-top:10px;min-height:18px}

  /* ── APP ── */
  #app{display:none;min-height:100vh}

  /* ── TOPBAR ── */
  .topbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border);height:60px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
  .topbar-left{display:flex;align-items:center;gap:14px}
  .topbar-logo{font-family:'Playfair Display',serif;font-size:18px;color:var(--vert)}
  .topbar-sep{width:1px;height:20px;background:var(--border)}
  .topbar-role{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .badge-ong{background:#E8F5E9;color:var(--vert)}
  .badge-microfinance{background:#E3F2FD;color:var(--blue)}
  .badge-etat{background:#FFF8E1;color:#B7770D}
  .topbar-name{font-size:13px;color:var(--muted)}
  .topbar-right{display:flex;align-items:center;gap:12px}
  .topbar-region{font-size:12px;color:var(--muted)}
  .logout-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 14px;color:var(--muted);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
  .logout-btn:hover{border-color:var(--red);color:var(--red)}

  /* ── TABS ── */
  .tab-bar{background:#fff;border-bottom:1px solid var(--border);padding:0 32px;display:flex}
  .tab-btn{background:none;border:none;border-bottom:2px solid transparent;padding:14px 20px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;display:flex;align-items:center;gap:6px}
  .tab-btn:hover{color:var(--vert)}
  .tab-btn.active{color:var(--vert);border-bottom-color:var(--vert2);font-weight:600}

  /* ── CONTENT ── */
  .content{padding:32px;max-width:1280px;margin:0 auto}
  .section-title{font-family:'Playfair Display',serif;font-size:22px;color:var(--vert);margin-bottom:4px}
  .section-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
  .subsection-title{font-size:15px;font-weight:600;color:var(--text);margin:28px 0 14px;display:flex;align-items:center;gap:8px}
  .subsection-title::before{content:'';display:block;width:3px;height:18px;background:var(--vert2);border-radius:2px}

  /* ── KPI CARDS ── */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
  .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--vert2)}
  .kpi-icon{font-size:22px}
  .kpi-value{font-size:28px;font-weight:700;color:var(--vert);letter-spacing:-1px}
  .kpi-label{font-size:12px;color:var(--muted);font-weight:500}
  .kpi-blue .kpi-value{color:var(--blue)}
  .kpi-blue{border-top-color:var(--blue)}
  .kpi-amber .kpi-value{color:var(--amber)}
  .kpi-amber{border-top-color:var(--amber)}
  .kpi-purple .kpi-value{color:var(--purple)}
  .kpi-purple{border-top-color:var(--purple)}
  .kpi-red .kpi-value{color:var(--red)}
  .kpi-red{border-top-color:var(--red)}

  /* ── CHARTS ── */
  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
  .charts-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:24px}
  .charts-full{grid-template-columns:1fr}
  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
  .chart-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:16px}
  .chart-wrap{position:relative;height:260px}

  /* ── TABLES ── */
  .table-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:24px}
  .table-head{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
  .table-title{font-size:14px;font-weight:600;color:var(--text)}
  .table-actions{display:flex;gap:8px;align-items:center}
  .search-input{border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none;color:var(--text);width:220px;transition:border .2s}
  .search-input:focus{border-color:var(--vert2)}
  table{width:100%;border-collapse:collapse}
  th{background:var(--vert-bg);padding:10px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  td{padding:11px 16px;font-size:13px;border-top:1px solid var(--border)}
  tr:hover td{background:var(--vert-bg)}
  .table-foot{padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);background:var(--vert-bg)}
  .table-info{font-size:12px;color:var(--muted)}
  .pagination{display:flex;gap:4px}
  .page-btn{border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;background:#fff;font-family:'DM Sans',sans-serif;color:var(--text);transition:all .15s}
  .page-btn.active{background:var(--vert2);color:#fff;border-color:var(--vert2)}
  .page-btn:hover:not(.active){border-color:var(--vert2)}
  .page-btn:disabled{cursor:default}

  /* ── BADGES ── */
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .b-green{background:#E8F5E9;color:var(--vert)}
  .b-amber{background:#FFF3CD;color:#856404}
  .b-red{background:#FDECEA;color:var(--red)}
  .b-blue{background:#E3F2FD;color:var(--blue)}
  .b-gray{background:#F5F5F5;color:#555}
  .b-purple{background:#F3E5F5;color:var(--purple)}

  /* ── SCORE BAR ── */
  .score-row{display:flex;align-items:center;gap:8px}
  .score-bar{height:6px;border-radius:3px;background:var(--border);flex:1;overflow:hidden}
  .score-fill{height:100%;border-radius:3px;transition:width .4s}
  .score-num{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);min-width:32px;text-align:right}

  /* ── STATES ── */
  .loading{text-align:center;padding:64px;color:var(--muted)}
  .spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--vert2);border-radius:50%;animation:spin .6s linear infinite;margin-bottom:12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty-state{text-align:center;padding:48px;color:var(--muted)}
  .empty-icon{font-size:36px;margin-bottom:12px}
  .info-banner{background:#F0F9F0;border:1px solid var(--vert-pale);border-radius:12px;padding:14px 18px;font-size:13px;color:var(--vert);display:flex;align-items:center;gap:10px;margin-bottom:24px}
  .warn-banner{background:#FFF3CD;border:1px solid #FFECB3;border-radius:12px;padding:12px 16px;font-size:12px;color:#856404;display:flex;align-items:center;gap:8px;margin-bottom:20px}
  .btn-outline{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .2s;display:inline-flex;align-items:center;gap:5px}
  .btn-outline:hover{border-color:var(--vert2);color:var(--vert)}

  /* ── FORMATION ROW ── */
  .formation-prix{font-family:'DM Mono',monospace;font-size:12px;color:var(--vert);font-weight:600}

  @media(max-width:768px){
    .charts-grid,.charts-grid-3{grid-template-columns:1fr}
    .kpi-grid{grid-template-columns:repeat(2,1fr)}
    .content{padding:16px}
    .topbar{padding:0 16px}
  }
</style>
</head>
<body>

<!-- ═══════ LOGIN ═══════ -->
<div id="loginScreen">
  <div class="login-dots"></div>
  <div class="login-card">
    <div class="login-logo">🌱 CultivaTech</div>
    <div class="login-sub">Agriculture intelligente au Burkina Faso</div>
    <div class="login-badge">Portail Partenaires</div>

    <div class="role-grid">
      <button class="role-btn" data-role="ong" onclick="selectRole('ong')">
        <span class="role-icon">🤝</span>ONG
      </button>
      <button class="role-btn" data-role="microfinance" onclick="selectRole('microfinance')">
        <span class="role-icon">🏦</span>Microfinance
      </button>
      <button class="role-btn" data-role="etat" onclick="selectRole('etat')">
        <span class="role-icon">🏛️</span>État
      </button>
    </div>

    <input class="login-input" id="username" type="text" placeholder="Identifiant" autocomplete="username">
    <input class="login-input" id="password" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="login-btn" id="loginBtn" onclick="doLogin()" disabled>Se connecter</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ═══════ APP ═══════ -->
<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">🌱 CultivaTech</span>
      <div class="topbar-sep"></div>
      <span id="roleBadge" class="topbar-role"></span>
      <span id="topbarName" class="topbar-name"></span>
    </div>
    <div class="topbar-right">
      <span id="topbarRegion" class="topbar-region"></span>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <nav class="tab-bar" id="tabBar"></nav>
  <main class="content" id="mainContent">
    <div class="loading"><div class="spinner"></div><div>Chargement…</div></div>
  </main>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════════════════════
const FUNCTIONS_URL = 'https://vyqhzagajlbosikzfnit.supabase.co/functions/v1'

// ══════════════════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════════════════
let TOKEN        = sessionStorage.getItem('partner_token')
let USER         = JSON.parse(sessionStorage.getItem('partner_user') || 'null')
let DATA         = null
let CHARTS       = {}
let selectedRole = null
let currentTab   = null
let filteredRows = []
let currentPage  = 1
const PAGE_SIZE  = 15

if (TOKEN && USER) { showApp(); fetchAndRender() }

// ══════════════════════════════════════════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════════════════════════════════════════
function selectRole(role) {
  selectedRole = role
  document.querySelectorAll('.role-btn').forEach(b => b.classList.toggle('active', b.dataset.role === role))
  document.getElementById('loginBtn').disabled = false
}

async function doLogin() {
  const username = document.getElementById('username').value.trim()
  const password = document.getElementById('password').value
  const errEl    = document.getElementById('loginError')
  errEl.textContent = ''

  if (!selectedRole) { errEl.textContent = 'Veuillez sélectionner un rôle.'; return }
  if (!username || !password) { errEl.textContent = 'Identifiant et mot de passe requis.'; return }

  const btn = document.getElementById('loginBtn')
  btn.textContent = 'Connexion…'; btn.disabled = true

  try {
    const res  = await fetch(FUNCTIONS_URL + '/partner-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, role: selectedRole })
    })
    const data = await res.json()
    if (!res.ok) {
      errEl.textContent = data.error || 'Identifiants incorrects.'
      btn.textContent = 'Se connecter'; btn.disabled = false
      return
    }
    TOKEN = data.token
    USER  = data.user
    sessionStorage.setItem('partner_token', TOKEN)
    sessionStorage.setItem('partner_user', JSON.stringify(USER))
    showApp()
    await fetchAndRender()
  } catch (_) {
    errEl.textContent = 'Erreur r\xe9seau. V\xe9rifiez votre connexion.'
    btn.textContent = 'Se connecter'; btn.disabled = false
  }
}

document.getElementById('username').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus()
})
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin()
})

// ══════════════════════════════════════════════════════════════════════════════
// APP INIT
// ══════════════════════════════════════════════════════════════════════════════
function showApp() {
  document.getElementById('loginScreen').style.display = 'none'
  document.getElementById('app').style.display = 'block'

  const ROLE_LABEL = { ong:'🤝 ONG', microfinance:'🏦 Microfinance', etat:'🏛️ \xC9tat' }
  const ROLE_CLS   = { ong:'badge-ong', microfinance:'badge-microfinance', etat:'badge-etat' }

  const badge = document.getElementById('roleBadge')
  badge.textContent = ROLE_LABEL[USER.role] || USER.role
  badge.className = 'topbar-role ' + (ROLE_CLS[USER.role] || '')
  document.getElementById('topbarName').textContent = USER.name
  document.getElementById('topbarRegion').textContent = '📍 ' + (USER.region || 'National')

  buildTabBar()
}

const TAB_META = {
  overview:    { icon:'📊', label:"Vue d'ensemble" },
  terrain:     { icon:'🌾', label:'Terrain' },
  formations:  { icon:'🎓', label:'Formations' },
  credit:      { icon:'💳', label:'Cr\xe9dit agricole' },
  productions: { icon:'📦', label:'Productions' },
}

function buildTabBar() {
  const bar  = document.getElementById('tabBar')
  bar.innerHTML = ''
  const tabs = USER.tabs || ['overview']
  tabs.forEach((t, i) => {
    const btn = document.createElement('button')
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '')
    btn.dataset.tab = t
    btn.onclick = function() { switchTab(t) }
    const m = TAB_META[t] || { icon:'•', label:t }
    btn.innerHTML = m.icon + ' ' + m.label
    bar.appendChild(btn)
  })
  currentTab = tabs[0]
}

function switchTab(tab) {
  currentTab = tab
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab))
  if (DATA) { killCharts(); renderCurrentTab() }
}

// ══════════════════════════════════════════════════════════════════════════════
// DATA FETCH
// ══════════════════════════════════════════════════════════════════════════════
async function fetchAndRender() {
  document.getElementById('mainContent').innerHTML =
    '<div class="loading"><div class="spinner"></div><div>Chargement des donn\xe9es…</div></div>'
  try {
    const res = await fetch(FUNCTIONS_URL + '/get-partner-stats', {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    })
    if (res.status === 401) { logout(); return }
    if (!res.ok) throw new Error('HTTP ' + res.status)
    DATA = await res.json()
    killCharts()
    renderCurrentTab()
  } catch (e) {
    document.getElementById('mainContent').innerHTML =
      '<div class="empty-state"><div class="empty-icon">⚠️</div>' +
      '<div style="margin-bottom:12px">Impossible de charger les donn\xe9es.<br><small style="color:var(--muted)">' + e.message + '</small></div>' +
      '<button onclick="fetchAndRender()" class="btn-outline" style="margin:0 auto">↺ R\xe9essayer</button></div>'
  }
}

function renderCurrentTab() {
  var MAP = { overview:renderOverview, terrain:renderTerrain, formations:renderFormations, credit:renderCredit, productions:renderProductions }
  ;(MAP[currentTab] || renderOverview)()
}

// ══════════════════════════════════════════════════════════════════════════════
// CHART HELPERS
// ══════════════════════════════════════════════════════════════════════════════
function killCharts() {
  Object.values(CHARTS).forEach(function(c) { try { c.destroy() } catch(e){} })
  CHARTS = {}
}

function mkChart(id, cfg) {
  var el = document.getElementById(id)
  if (!el) return null
  try { var ex = Chart.getChart(el); if(ex) ex.destroy() } catch(e){}
  CHARTS[id] = new Chart(el, cfg)
  return CHARTS[id]
}

function axisOpts(opt) {
  opt = opt || {}
  var legend = opt.legend !== false
  var stacked = !!opt.stacked
  var max = opt.max
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display:legend, position:'bottom', labels:{ font:{ family:'DM Sans' }, boxWidth:12 } } },
    scales: {
      x: { stacked:stacked, grid:{display:false}, ticks:{font:{family:'DM Sans',size:11}} },
      y: { stacked:stacked, beginAtZero:true, max:max, grid:{color:'#f0f0f0'}, ticks:{font:{family:'DM Sans',size:11}} }
    }
  }
}

function horzOpts() {
  return {
    responsive:true, maintainAspectRatio:false, indexAxis:'y',
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ beginAtZero:true, grid:{color:'#f0f0f0'}, ticks:{font:{family:'DM Sans',size:11}} },
      y:{ grid:{display:false}, ticks:{font:{family:'DM Sans',size:10}} }
    }
  }
}

function greenPalette(n) {
  var arr = []
  for (var i = 0; i < n; i++) arr.push('hsl(' + (125+i*14) + ',' + (55-i) + '%,' + (42+i*2) + '%)')
  return arr
}

// ══════════════════════════════════════════════════════════════════════════════
// OVERVIEW — commun à tous les rôles
// ══════════════════════════════════════════════════════════════════════════════
function renderOverview() {
  var k    = DATA.kpis || {}
  var role = USER.role
  var html = ''

  // KPIs globaux — afficher '—' si DB vide
  html += '<h2 class="section-title">Vue d’ensemble</h2>'
  html += '<p class="section-sub">Indicateurs cl\xe9s — mis \xe0 jour le ' + fmtDate(DATA.last_updated) + '</p>'
  html += '<div class="kpi-grid">'
  html += kpiCard('', '👨‍🌾', k.users,       'Agriculteurs inscrits')
  html += kpiCard('', '🌱', k.productions,  'Productions enregistr\xe9es')
  html += kpiCard('', '🏪', k.shops,        'Boutiques agri-input')
  html += kpiCard('kpi-amber', '🔬', k.diagnostics, 'Diagnostics r\xe9alis\xe9s')
  html += kpiCard('kpi-purple', '🛒', k.purchases,  'Achats enregistr\xe9s')

  // Extra cards selon rôle
  if (role === 'ong' && DATA.ong) {
    var g  = (DATA.ong.scores && DATA.ong.scores.global) || {}
    var tr = DATA.ong.trainings || {}
    html += kpiCard('kpi-blue', '✅', g.eligible || 0, '\xC9ligibles cr\xe9dit')
    html += kpiCard('', '⭐', (g.total > 0 ? g.moyenne : null), 'Score agricole moyen', g.total > 0 ? '/100' : '')
    html += kpiCard('kpi-amber', '🎓', tr.total > 0 ? tr.total : null, 'Formations disponibles')
    html += kpiCard('', '📋', DATA.ong.fiches_total > 0 ? DATA.ong.fiches_total : null, 'Fiches techniques consult\xe9es')
  }
  if (role === 'microfinance' && DATA.microfinance && DATA.microfinance.stats) {
    var s = DATA.microfinance.stats
    var taux = s.total ? Math.round(s.eligible / s.total * 100) : 0
    html += kpiCard('kpi-blue', '✅', s.eligible, '\xC9ligibles cr\xe9dit')
    html += kpiCard('', '⭐', s.score_moyen || null, 'Score moyen', s.score_moyen ? '/100' : '')
    html += kpiCard('kpi-amber', '📈', taux, 'Taux d’\xe9ligibilit\xe9', '%')
  }
  html += '</div>'

  if (k.users === 0) {
    html += '<div class="info-banner">ℹ️ Les donn\xe9es s’afficheront d\xe8s que des agriculteurs auront utilis\xe9 l’application CultivaTech.</div>'
  }

  document.getElementById('mainContent').innerHTML = html
}

function kpiCard(cls, icon, val, label, suffix) {
  var display = (val === null || val === undefined || val === '') ? '—' : fmtN(val) + (suffix || '')
  return '<div class="kpi-card ' + (cls||'') + '">' +
    '<div class="kpi-icon">' + icon + '</div>' +
    '<div class="kpi-value">' + display + '</div>' +
    '<div class="kpi-label">' + label + '</div>' +
    '</div>'
}

function renderFormationsTable() {
  var total = filteredRows.length
  var pages = Math.ceil(total / PAGE_SIZE) || 1
  currentPage = Math.min(currentPage, pages)
  var slice = filteredRows.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE)

  var body = document.getElementById('formationsBody')
  if (!body) return
  if (slice.length === 0) {
    body.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--muted)">Aucun r\xe9sultat</td></tr>'
  } else {
    body.innerHTML = slice.map(function(t) {
      var prix = t.is_free ? '<span class="badge b-green">Gratuite</span>' : (t.prix ? '<span class="formation-prix">' + fmtN(t.prix) + ' FCFA</span>' : '<span style="color:var(--muted)">N/A</span>')
      var certif = t.is_certifiante ? '<span class="badge b-purple">🏅 Oui</span>' : '<span style="color:var(--muted);font-size:12px">Non</span>'
      var debut  = t.date_debut ? new Date(t.date_debut).toLocaleDateString('fr-FR') : '—'
      return '<tr>' +
        '<td><strong>' + esc(t.title||'') + '</strong></td>' +
        '<td style="font-size:12px;color:var(--muted)">' + esc(t.organisme||'—') + '</td>' +
        '<td><span class="badge b-blue">' + esc(t.ville||'—') + '</span></td>' +
        '<td style="font-size:12px;color:var(--muted)">' + esc(t.categorie||'—') + '</td>' +
        '<td>' + prix + '</td>' +
        '<td>' + certif + '</td>' +
        '<td style="font-family:\'DM Mono\',monospace;font-size:12px">' + debut + '</td>' +
        '</tr>'
    }).join('')
  }

  document.getElementById('fInfo').textContent = total + ' formation' + (total>1?'s':'') + ' — page ' + currentPage + '/' + pages
  var pag = document.getElementById('fPag')
  if (!pag) return
  pag.innerHTML = ''
  if (currentPage > 1) addPageBtn(pag, '‹', currentPage-1, false)
  for (var p = Math.max(1,currentPage-2); p <= Math.min(pages,currentPage+2); p++) addPageBtn(pag, p, p, p===currentPage)
  if (currentPage < pages) addPageBtn(pag, '›', currentPage+1, false)
}

function addPageBtn(container, label, page, active) {
  var b = document.createElement('button')
  b.className = 'page-btn' + (active?' active':'')
  b.textContent = label
  var p = page
  b.onclick = function(){ currentPage = p; if(currentTab === 'formations') renderFormationsTable(); else renderCreditTable() }
  if (active) b.disabled = true
  container.appendChild(b)
}

function searchFormations(q) {
  var all = ((DATA.ong && DATA.ong.trainings && DATA.ong.trainings.list) || [])
  var lq = q.toLowerCase()
  filteredRows = lq ? all.filter(function(t) {
    return (t.title||'').toLowerCase().includes(lq) ||
           (t.organisme||'').toLowerCase().includes(lq) ||
           (t.ville||'').toLowerCase().includes(lq) ||
           (t.categorie||'').toLowerCase().includes(lq)
  }) : all.slice()
  currentPage = 1
  renderFormationsTable()
}

    ]
    mkChart('cDist', { type:'bar', data:{ labels:dist.map(function(d){return d.label}), datasets:[{ label:'Agriculteurs', data:dist.map(function(d){return d.count}), backgroundColor:'#36AF3B', borderRadius:6 }] }, options:axisOpts({legend:false}) })
    var stMap = {}
    users.forEach(function(u){ var k=u.statut||'Non \xe9valu\xe9'; stMap[k]=(stMap[k]||0)+1 })
    var SCOL = { '\xC9ligible cr\xe9dit':'#36AF3B', '\xC0 \xe9valuer':'#D68910', 'Insuffisant':'#C0392B', 'Non \xe9valu\xe9':'#aaa' }
    mkChart('cStatut', { type:'doughnut', data:{ labels:Object.keys(stMap), datasets:[{ data:Object.values(stMap), backgroundColor:Object.keys(stMap).map(function(k){return SCOL[k]||'#aaa'}), borderWidth:2, borderColor:'#fff' }] }, options:{ plugins:{ legend:{ position:'bottom' } }, cutout:'55%', maintainAspectRatio:false, responsive:true } })
    renderCreditTable()
  }, 80)
}

function renderCreditTable() {
  var total = filteredRows.length
  var pages = Math.ceil(total / PAGE_SIZE) || 1
  currentPage = Math.min(currentPage, pages)
  var slice = filteredRows.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE)

  var body = document.getElementById('creditBody')
  if (!body) return
  if (slice.length === 0) {
    body.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--muted)">Aucun r\xe9sultat</td></tr>'
  } else {
    body.innerHTML = slice.map(function(u) {
      var sc  = u.score || 0
      var col = sc >= 61 ? 'var(--vert2)' : sc >= 41 ? 'var(--amber)' : 'var(--red)'
      return '<tr>' +
        '<td><strong>' + esc((u.first_name||'') + ' ' + (u.last_name||'')) + '</strong></td>' +
        '<td style="font-family:\'DM Mono\',monospace;font-size:12px">' + esc(u.phone_number||'—') + '</td>' +
        '<td><div class="score-row"><div class="score-bar"><div class="score-fill" style="width:' + sc + '%;background:' + col + '"></div></div><span class="score-num">' + sc + '</span></div></td>' +
        '<td>' + statutBadge(u.statut) + '</td>' +
        '<td style="font-size:12px;color:var(--muted)">' + esc(u.region||'—') + '</td>' +
        '<td style="font-size:12px;color:var(--muted)">' + esc(u.province||'—') + '</td>' +
        '<td style="font-size:12px;color:var(--muted)">' + fmtYear(u.date_inscription) + '</td>' +
        '</tr>'
    }).join('')
  }
  var infoEl = document.getElementById('tblInfo')
  if (infoEl) infoEl.textContent = total + ' r\xe9sultat' + (total>1?'s':'') + ' — page ' + currentPage + '/' + pages
  var pag = document.getElementById('tblPag')
  if (pag) {
    pag.innerHTML = ''
    if (currentPage > 1) addPageBtn(pag, '‹', currentPage-1, false)
    for (var p = Math.max(1,currentPage-2); p <= Math.min(pages,currentPage+2); p++) addPageBtn(pag, p, p, p===currentPage)
    if (currentPage < pages) addPageBtn(pag, '›', currentPage+1, false)
  }
}

function searchCredit(q) {
  var all = (DATA.microfinance && DATA.microfinance.users) || []
  var lq  = q.toLowerCase()
  filteredRows = lq ? all.filter(function(u) {
    return ((u.first_name||'') + ' ' + (u.last_name||'')).toLowerCase().includes(lq) || (u.phone_number||'').includes(lq)
  }) : all.slice()
  currentPage = 1
  renderCreditTable()
}

function exportCSV() {
  var rows = (DATA.microfinance && DATA.microfinance.users) || []
  var BOM  = '﻿'
  var HDR  = ['Pr\xe9nom','Nom','T\xe9l\xe9phone','Score','Statut','R\xe9gion','Province','Inscription']
  var body = rows.map(function(u) {
    return [u.first_name,u.last_name,u.phone_number,u.score,u.statut,u.region,u.province,
      u.date_inscription ? new Date(u.date_inscription).toLocaleDateString('fr-FR') : '']
  })
  var csv = BOM + [HDR].concat(body).map(function(r){ return r.map(function(v){ return '"' + String(v||'').replace(/"/g,'""') + '"' }).join(';') }).join('\n')
  var a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}))
  a.download = 'cultivatech_credit_' + new Date().toISOString().slice(0,10) + '.csv'
  a.click()
}

// ══════════════════════════════════════════════════════════════════════════════
// PRODUCTIONS — État
// ══════════════════════════════════════════════════════════════════════════════
function renderProductions() {
  var cultures = ((DATA.etat && DATA.etat.cultures) || []).sort(function(a,b){return b.total-a.total}).slice(0,15)
  var html = ''
  html += '<h2 class="section-title">Productions agricoles</h2>'
  html += '<p class="section-sub">\xC9tat d’avancement par culture</p>'

  if (cultures.length) {
    html += '<div class="charts-grid charts-full" style="margin-bottom:24px">'
    html += '<div class="chart-card"><div class="chart-title">En cours vs termin\xe9es par culture</div><div class="chart-wrap" style="height:300px"><canvas id="cProds"></canvas></div></div>'
    html += '</div>'
  }

  html += '<div class="table-card"><div class="table-head"><span class="table-title">📊 D\xe9tail par culture (' + cultures.length + ')</span></div>'
  html += '<table><thead><tr><th>Culture</th><th>Total</th><th>En cours</th><th>Termin\xe9es</th><th>Part (%)</th><th>Taux ach\xe8vement</th></tr></thead><tbody>'
  if (cultures.length === 0) {
    html += '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">Aucune production</td></tr>'
  } else {
    cultures.forEach(function(c) {
      var taux = c.total ? Math.round(c.terminees / c.total * 100) : 0
      var col  = taux > 70 ? 'var(--vert2)' : taux > 40 ? 'var(--amber)' : 'var(--red)'
      html += '<tr><td><strong>' + esc(c.name) + '</strong></td>' +
        '<td style="font-family:\'DM Mono\',monospace">' + c.total + '</td>' +
        '<td><span class="badge b-amber">' + c.en_cours + '</span></td>' +
        '<td><span class="badge b-green">' + c.terminees + '</span></td>' +
        '<td style="font-size:12px;color:var(--muted)">' + c.pourcentage + '%</td>' +
        '<td><div class="score-row"><div class="score-bar"><div class="score-fill" style="width:' + taux + '%;background:' + col + '"></div></div><span class="score-num">' + taux + '%</span></div></td>' +
        '</tr>'
    })
  }
  html += '</tbody></table></div>'
  document.getElementById('mainContent').innerHTML = html

  setTimeout(function() {
    if (!cultures.length) return
    mkChart('cProds', {
      type:'bar',
      data:{ labels:cultures.map(function(c){return c.name}), datasets:[
        { label:'En cours',   data:cultures.map(function(c){return c.en_cours}),  backgroundColor:'#D68910', borderRadius:4 },
        { label:'Termin\xe9es', data:cultures.map(function(c){return c.terminees}), backgroundColor:'#36AF3B', borderRadius:4 },
      ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:true, position:'bottom', labels:{font:{family:'DM Sans'},boxWidth:12} } },
        scales:{ x:{ stacked:true, grid:{display:false}, ticks:{font:{family:'DM Sans',size:11}} }, y:{ stacked:true, beginAtZero:true, grid:{color:'#f0f0f0'}, ticks:{font:{family:'DM Sans',size:11}} } } }
    })
  }, 80)
}

// LOGOUT
// ══════════════════════════════════════════════════════════════════════════════
function logout() {
  sessionStorage.removeItem('partner_token')
  sessionStorage.removeItem('partner_user')
  TOKEN = null; USER = null; DATA = null
  killCharts()
  document.getElementById('loginScreen').style.display = 'flex'
  document.getElementById('app').style.display = 'none'
  document.getElementById('loginBtn').disabled = true
  document.getElementById('username').value = ''
  document.getElementById('password').value = ''
  document.getElementById('loginError').textContent = ''
  document.querySelectorAll('.role-btn').forEach(function(b){ b.classList.remove('active') })
  selectedRole = null
}

// UTILS

function fmtN(n)     { return n != null ? Number(n).toLocaleString('fr-FR') : '—' }
function fmt(n)      { return n != null && n !== '' ? Number(n).toLocaleString('fr-FR') : '—' }
function fmtDate(iso){ return iso ? new Date(iso).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}) : '—' }
function fmtYear(iso){ return iso ? new Date(iso).getFullYear() : '—' }
function esc(s)      { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function urgBadge(u) {
  var m = { '\xC9lev\xe9e':'b-red', 'Mod\xe9r\xe9e':'b-amber', 'Faible':'b-green' }
  return '<span class="badge ' + (m[u]||'b-gray') + '">' + esc(u||'—') + '</span>'
}
function statutBadge(s) {
  var m = { '\xC9ligible cr\xe9dit':'b-green', '\xC0 \xe9valuer':'b-amber', 'Insuffisant':'b-red' }
  return '<span class="badge ' + (m[s]||'b-gray') + '">' + esc(s||'Non \xe9valu\xe9') + '</span>'
}
