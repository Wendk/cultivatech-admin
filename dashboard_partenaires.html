<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CultivaTech - Portail Partenaires</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --vert:#1A5319; --vert2:#36AF3B; --vert-pale:#D6EFD8; --vert-perc:#024B2A;
    --or:#C8A84B; --bg:#F8FAF8; --bg2:#FFFFFF; --card:#FFFFFF;
    --border:#E4EDE4; --text:#1A2E1A; --muted:#6B8F6B;
    --red:#C0392B; --amber:#D68910; --blue:#2471A3;
    --shadow: 0 1px 3px rgba(26,83,25,0.08), 0 4px 16px rgba(26,83,25,0.06);
    --shadow-lg: 0 8px 32px rgba(26,83,25,0.12);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── LOGIN ── */
  #loginScreen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0D1F0D 0%, #1A5319 40%, #024B2A 100%);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; flex-direction: column; gap: 24px;
  }

  .login-bg-pattern {
    position: absolute; inset: 0; opacity: 0.05;
    background-image: radial-gradient(circle at 2px 2px, #fff 1px, transparent 0);
    background-size: 32px 32px;
  }

  .login-card {
    position: relative;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 48px;
    width: 400px;
    text-align: center;
  }

  .login-logo {
    font-family: 'Playfair Display', serif;
    font-size: 32px; color: #fff; margin-bottom: 4px; letter-spacing: -0.5px;
  }
  .login-sub { color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 8px; }
  .login-badge {
    display: inline-block;
    background: rgba(54,175,59,0.2); border: 1px solid rgba(54,175,59,0.4);
    color: var(--vert2); font-size: 11px; font-weight: 600;
    padding: 4px 12px; border-radius: 20px; margin-bottom: 32px;
    letter-spacing: 0.5px; text-transform: uppercase;
  }

  .login-role-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px; margin-bottom: 24px;
  }
  .login-role-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 12px 8px;
    color: rgba(255,255,255,0.6); font-size: 11px; font-weight: 500;
    cursor: pointer; transition: all 0.2s; text-align: center;
    font-family: 'DM Sans', sans-serif;
  }
  .login-role-btn:hover { border-color: rgba(54,175,59,0.5); color: var(--vert2); }
  .login-role-btn.active {
    background: rgba(54,175,59,0.15); border-color: var(--vert2);
    color: var(--vert2);
  }
  .login-role-icon { font-size: 20px; display: block; margin-bottom: 4px; }

  .login-input {
    width: 100%; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; padding: 14px 16px; color: #fff;
    font-size: 14px; font-family: 'DM Sans', sans-serif;
    outline: none; margin-bottom: 10px; transition: border 0.2s;
  }
  .login-input::placeholder { color: rgba(255,255,255,0.3); }
  .login-input:focus { border-color: var(--vert2); }

  .login-btn {
    width: 100%; background: var(--vert2); border: none;
    border-radius: 12px; padding: 15px; color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: all 0.2s;
    margin-top: 4px;
  }
  .login-btn:hover { background: #2d9e32; transform: translateY(-1px); }
  .login-error { color: #ff7675; font-size: 12px; margin-top: 8px; display: none; }

  /* ── APP ── */
  #app { display: none; min-height: 100vh; }

  /* TOPBAR */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 0 32px; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 1px 0 var(--border);
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .topbar-logo {
    font-family: 'Playfair Display', serif;
    font-size: 18px; color: var(--vert); letter-spacing: -0.3px;
  }
  .topbar-sep { width: 1px; height: 20px; background: var(--border); }
  .topbar-role {
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .topbar-refresh {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--vert2);
    animation: pulse-dot 2s infinite;
  }
  @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

  .topbar-user {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--text);
  }
  .topbar-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, var(--vert), var(--vert2));
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff;
  }
  .logout-btn {
    font-size: 12px; color: var(--red); cursor: pointer;
    background: none; border: 1px solid #fde8e6;
    border-radius: 8px; padding: 6px 12px;
    font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .logout-btn:hover { background: #fde8e6; }

  /* NAV TABS */
  .nav-tabs {
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 0 32px; display: flex; gap: 0;
  }
  .nav-tab {
    padding: 14px 20px; font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
    transition: all 0.2s; white-space: nowrap;
  }
  .nav-tab:hover { color: var(--vert); }
  .nav-tab.active { color: var(--vert); border-bottom-color: var(--vert2); }

  /* MAIN */
  .main { padding: 32px; max-width: 1400px; margin: 0 auto; }

  /* PAGE */
  .page { display: none; }
  .page.active { display: block; }

  .page-header { margin-bottom: 28px; }
  .page-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px; color: var(--text); margin-bottom: 4px;
  }
  .page-sub { font-size: 13px; color: var(--muted); }

  /* KPI GRID */
  .kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 28px; }
  .kpi-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px; position: relative; overflow: hidden;
    box-shadow: var(--shadow); transition: box-shadow 0.2s;
  }
  .kpi-card:hover { box-shadow: var(--shadow-lg); }
  .kpi-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
  .kpi-card.green::before { background: linear-gradient(90deg, var(--vert), var(--vert2)); }
  .kpi-card.amber::before { background: linear-gradient(90deg, #a07020, var(--amber)); }
  .kpi-card.blue::before { background: linear-gradient(90deg, #1a4a6a, var(--blue)); }
  .kpi-card.red::before { background: linear-gradient(90deg, #8a1a1a, var(--red)); }
  .kpi-icon { font-size: 22px; margin-bottom: 12px; display: block; }
  .kpi-value {
    font-family: 'Playfair Display', serif;
    font-size: 30px; margin-bottom: 4px; line-height: 1;
  }
  .kpi-card.green .kpi-value { color: var(--vert); }
  .kpi-card.amber .kpi-value { color: var(--amber); }
  .kpi-card.blue .kpi-value { color: var(--blue); }
  .kpi-card.red .kpi-value { color: var(--red); }
  .kpi-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .kpi-loading { color: var(--border); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }

  /* CHARTS */
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .chart-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; box-shadow: var(--shadow);
  }
  .chart-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .chart-sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
  .chart-wrap { position: relative; height: 220px; }

  /* TABLE */
  .table-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .table-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .table-title { font-size: 14px; font-weight: 600; color: var(--text); }
  table { width: 100%; border-collapse: collapse; }
  th {
    font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.5px; padding: 0 0 12px; text-align: left; font-weight: 600;
  }
  td { font-size: 13px; color: var(--text); padding: 10px 0; border-top: 1px solid var(--border); }
  .td-muted { color: var(--muted); }

  /* BADGE */
  .badge { font-size: 10px; padding: 3px 10px; border-radius: 20px; font-weight: 600; display: inline-block; }
  .badge-green { background: #e8f7e8; color: var(--vert); }
  .badge-amber { background: #fef6e4; color: var(--amber); }
  .badge-red { background: #fde8e6; color: var(--red); }
  .badge-blue { background: #e8f0fa; color: var(--blue); }

  /* SCORE BAR */
  .score-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .score-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--vert), var(--vert2)); transition: width 1s; }

  /* EXPORT BTN */
  .export-btn {
    background: var(--vert); border: none; border-radius: 10px;
    padding: 8px 16px; color: #fff; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .export-btn:hover { background: var(--vert2); }

  /* SEARCH */
  .search-bar { display: flex; gap: 10px; margin-bottom: 16px; }
  .search-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 16px; color: var(--text);
    font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; transition: border 0.2s;
  }
  .search-input:focus { border-color: var(--vert2); }
  .filter-select {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; color: var(--text);
    font-size: 12px; font-family: 'DM Sans', sans-serif; outline: none; cursor: pointer;
  }

  /* ALERT BANNER */
  .alert-banner {
    background: linear-gradient(135deg, var(--vert-pale), #f0faf0);
    border: 1px solid #c8e6c8; border-radius: 12px;
    padding: 16px 20px; margin-bottom: 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .alert-icon { font-size: 20px; }
  .alert-text { font-size: 13px; color: var(--vert-perc); }
  .alert-text strong { font-weight: 600; }

  /* STAT ROW */
  .stat-row {
    display: flex; gap: 12px; margin-bottom: 24px;
  }
  .stat-chip {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; text-align: center; box-shadow: var(--shadow);
  }
  .stat-chip-val { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--vert); }
  .stat-chip-label { font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 500; }

  /* PAGINATION */
  .pagination { display: flex; gap: 6px; align-items: center; justify-content: flex-end; margin-top: 16px; }
  .page-btn {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; color: var(--muted); font-size: 12px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: all 0.15s;
  }
  .page-btn:hover, .page-btn.active { background: var(--vert); color: #fff; border-color: var(--vert); }
  .page-btn:disabled { opacity: 0.3; cursor: default; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns: repeat(2,1fr); }
    .charts-grid { grid-template-columns: 1fr; }
    .main { padding: 16px; }
    .topbar { padding: 0 16px; }
    .nav-tabs { padding: 0 16px; overflow-x: auto; }
  }
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="loginScreen">
  <div class="login-bg-pattern"></div>
  <div class="login-card">
    <div class="login-logo">CultivaTech</div>
    <div class="login-sub">Portail Partenaires Institutionnels</div>
    <div class="login-badge">Accès sécurisé</div>

    <div class="login-role-grid">
      <button class="login-role-btn active" data-role="ong">
        <span class="login-role-icon">🌍</span>ONG
      </button>
      <button class="login-role-btn" data-role="microfinance">
        <span class="login-role-icon">🏦</span>Microfinance
      </button>
      <button class="login-role-btn" data-role="etat">
        <span class="login-role-icon">🏛</span>État
      </button>
    </div>

    <input class="login-input" type="text" id="loginUser" placeholder="Identifiant partenaire" autocomplete="off"/>
    <input class="login-input" type="password" id="loginPass" placeholder="Mot de passe" autocomplete="off"/>
    <button class="login-btn" onclick="doLogin()">Accéder au portail</button>
    <div class="login-error" id="loginError">Identifiants incorrects</div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">CultivaTech</div>
      <div class="topbar-sep"></div>
      <div class="topbar-role" id="topbarRole">Portail Partenaire</div>
    </div>
    <div class="topbar-right">
      <div class="topbar-refresh">
        <div class="live-dot"></div>
        <span id="lastUpdateText">Chargement...</span>
      </div>
      <div class="topbar-user">
        <div class="topbar-avatar" id="topbarAvatar">?</div>
        <span id="topbarName">-</span>
      </div>
      <button class="logout-btn" onclick="doLogout()">Déconnexion</button>
    </div>
  </div>

  <!-- NAV TABS -->
  <div class="nav-tabs" id="navTabs"></div>

  <!-- MAIN -->
  <div class="main" id="mainContent"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
// CONFIGURATION
// ════════════════════════════════════════════════════════════════════
const FUNCTIONS_URL = 'https://vyqhzagajlbosikzfnit.supabase.co/functions/v1'
let partnerToken = null
let currentPartner = null
let autoRefreshTimer = null

let allCharts = {}
let currentStats = null

// ════════════════════════════════════════════════════════════════════
// UTILITAIRES
// ════════════════════════════════════════════════════════════════════
function escapeHtml(str) {
  if (!str) return ''
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}

function setKPI(id, value, subId, subValue) {
  const el = document.getElementById(id)
  if (el) { el.textContent = value; el.classList.remove('kpi-loading') }
  if (subId && document.getElementById(subId)) document.getElementById(subId).textContent = subValue || ''
}

// ════════════════════════════════════════════════════════════════════
// ADMIN FETCH
// ════════════════════════════════════════════════════════════════════
async function adminFetch(functionName, options = {}) {
  if (!partnerToken) throw new Error('Non authentifié')
  const res = await fetch(`${FUNCTIONS_URL}/${functionName}`, {
    method: options.method || 'GET',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${partnerToken}`
    },
    body: options.body ? JSON.stringify(options.body) : undefined
  })
  if (res.status === 401) { doLogout(); throw new Error('Session expirée') }
  if (!res.ok) throw new Error(await res.text())
  return res.json()
}

// ════════════════════════════════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════════════════════════════════
let selectedRole = 'ong'

function selectRole(role, btn) {
  selectedRole = role
  document.querySelectorAll('.login-role-btn').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
}

// Initialiser les boutons de rôle
document.querySelectorAll('.login-role-btn').forEach(btn => {
  btn.addEventListener('click', () => selectRole(btn.dataset.role, btn))
})

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim()
  const password = document.getElementById('loginPass').value
  const errEl = document.getElementById('loginError')
  
  // Récupérer le rôle sélectionné
  const activeRoleBtn = document.querySelector('.login-role-btn.active')
  const role = activeRoleBtn ? activeRoleBtn.dataset.role : 'ong'

  if (!username || !password) {
    errEl.textContent = 'Identifiant et mot de passe requis'
    errEl.style.display = 'block'
    return
  }

  try {
    const res = await fetch(`${FUNCTIONS_URL}/partner-login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, role })
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error)

    partnerToken = data.token
    currentPartner = data.user

    // Topbar
    const roleLabels = { ong: 'ONG', microfinance: 'Microfinance', etat: 'État' }
    document.getElementById('topbarRole').textContent = roleLabels[currentPartner.role]
    document.getElementById('topbarName').textContent = currentPartner.name
    document.getElementById('topbarAvatar').textContent = currentPartner.name[0]

    // Navigation
    const nav = document.getElementById('navTabs')
    const main = document.getElementById('mainContent')
    nav.innerHTML = ''
    main.innerHTML = ''

    const tabs = currentPartner.tabs
    tabs.forEach((tabKey, i) => {
      const btn = document.createElement('div')
      btn.className = 'nav-tab' + (i === 0 ? ' active' : '')
      btn.textContent = getTabLabel(tabKey)
      btn.onclick = () => showTab(tabKey)
      nav.appendChild(btn)
    })

    // Créer les pages
    tabs.forEach(tabKey => {
      const page = document.createElement('div')
      page.id = `page-${tabKey}`
      page.className = 'page' + (tabKey === tabs[0] ? ' active' : '')
      main.appendChild(page)
    })

    document.getElementById('loginScreen').style.display = 'none'
    document.getElementById('app').style.display = 'block'

    await loadCurrentTab()
    startAutoRefresh()

  } catch (e) {
    errEl.textContent = e.message
    errEl.style.display = 'block'
  }
}

function getTabLabel(tabKey) {
  const labels = {
    overview: '📊 Vue générale',
    terrain: '🌾 Données terrain',
    credit: '💰 Crédit agricole',
    productions: '🌱 Productions',
    formations: '📚 Formations'
  }
  return labels[tabKey] || tabKey
}

function doLogout() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer)
  partnerToken = null
  currentPartner = null
  allCharts = {}
  document.getElementById('app').style.display = 'none'
  document.getElementById('loginScreen').style.display = 'flex'
  document.getElementById('loginUser').value = ''
  document.getElementById('loginPass').value = ''
  document.getElementById('loginError').style.display = 'none'
}

function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer)
  autoRefreshTimer = setInterval(() => {
    loadCurrentTab()
  }, 300000) // 5 minutes
}

function updateLastUpdate() {
  document.getElementById('lastUpdateText').textContent = 'Mis à jour ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
}

let currentTab = null

async function showTab(tabKey) {
  currentTab = tabKey
  document.querySelectorAll('.nav-tab').forEach((t, i) => {
    t.classList.toggle('active', currentPartner.tabs[i] === tabKey)
  })
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
  const activePage = document.getElementById(`page-${tabKey}`)
  if (activePage) activePage.classList.add('active')
  await loadTabContent(tabKey)
}

async function loadCurrentTab() {
  if (currentPartner && currentPartner.tabs.length > 0) {
    const firstTab = currentPartner.tabs[0]
    currentTab = firstTab
    await loadTabContent(firstTab)
  }
}

async function loadTabContent(tabKey) {
  try {
    currentStats = await adminFetch('get-partner-stats')
    updateLastUpdate()

    if (tabKey === 'overview') await renderOverview()
    else if (tabKey === 'terrain') await renderTerrain()
    else if (tabKey === 'credit') await renderCredit()
    else if (tabKey === 'productions') await renderProductions()
    else if (tabKey === 'formations') await renderFormations()

  } catch (e) {
    console.error('Erreur chargement:', e)
    const page = document.getElementById(`page-${tabKey}`)
    if (page) page.innerHTML = `<div class="alert-banner"><div class="alert-icon">⚠️</div><div class="alert-text">Erreur de chargement des données</div></div>`
  }
}

// ════════════════════════════════════════════════════════════════════
// RENDER OVERVIEW (commun à tous)
// ════════════════════════════════════════════════════════════════════
async function renderOverview() {
  const page = document.getElementById('page-overview')
  const kpis = currentStats.kpis

  page.innerHTML = `
    <div class="page-header">
      <div class="page-title">Vue générale</div>
      <div class="page-sub">Données agricoles CultivaTech - ${escapeHtml(currentPartner.name)}</div>
    </div>
    <div class="alert-banner">
      <div class="alert-icon">📊</div>
      <div class="alert-text"><strong>Bienvenue sur le portail CultivaTech.</strong> Ces données sont anonymisées et agrégées. Elles sont mises à jour toutes les 5 minutes.</div>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card green"><span class="kpi-icon">👨‍🌾</span><div class="kpi-value" id="ovKpiAgri">${kpis.users}</div><div class="kpi-label">Agriculteurs actifs</div></div>
      <div class="kpi-card amber"><span class="kpi-icon">🌾</span><div class="kpi-value" id="ovKpiProd">${kpis.productions}</div><div class="kpi-label">Productions enregistrées</div></div>
      <div class="kpi-card blue"><span class="kpi-icon">🏪</span><div class="kpi-value" id="ovKpiBout">${kpis.shops}</div><div class="kpi-label">Boutiques partenaires</div></div>
      <div class="kpi-card red"><span class="kpi-icon">🔍</span><div class="kpi-value" id="ovKpiDiag">${kpis.diagnostics}</div><div class="kpi-label">Diagnostics effectués</div></div>
    </div>
    <div class="stat-row">
      <div class="stat-chip"><div class="stat-chip-val">${kpis.purchases}</div><div class="stat-chip-label">Formations achetées</div></div>
    </div>
  `

  // Si État, afficher les cultures et maladies
  if (currentPartner.role === 'etat' && currentStats.etat) {
    const etat = currentStats.etat
    page.innerHTML += `
      <div class="charts-grid">
        <div class="chart-card"><div class="chart-title">Top cultures</div><div class="chart-sub">Productions par culture</div><div class="chart-wrap"><canvas id="chartCultures"></canvas></div></div>
        <div class="chart-card"><div class="chart-title">Top maladies</div><div class="chart-sub">Maladies les plus diagnostiquées</div><div class="chart-wrap"><canvas id="chartMaladies"></canvas></div></div>
      </div>
    `
    const ctx1 = document.getElementById('chartCultures')?.getContext('2d')
    const ctx2 = document.getElementById('chartMaladies')?.getContext('2d')
    if (ctx1) {
      if (allCharts.cultures) allCharts.cultures.destroy()
      allCharts.cultures = new Chart(ctx1, {
        type: 'bar',
        data: { labels: etat.cultures.slice(0,7).map(c => c.name), datasets: [{ data: etat.cultures.slice(0,7).map(c => c.total), backgroundColor: '#36AF3B' }] }
      })
    }
    if (ctx2) {
      if (allCharts.maladies) allCharts.maladies.destroy()
      allCharts.maladies = new Chart(ctx2, {
        type: 'bar',
        data: { labels: etat.maladies.slice(0,7).map(m => m.name.length > 20 ? m.name.slice(0,20)+'...' : m.name), datasets: [{ data: etat.maladies.slice(0,7).map(m => m.count), backgroundColor: '#C0392B' }] }
      })
    }
  }

  // Si ONG, afficher les scores par région
  if (currentPartner.role === 'ong' && currentStats.ong && currentStats.ong.scores) {
    const scores = currentStats.ong.scores
    page.innerHTML += `
      <div class="table-card">
        <div class="table-header"><div class="table-title">Scores agricoles par région</div></div>
        <table><thead><tr><th>Région</th><th>Score moyen</th><th>Éligibles crédit</th><th>Taux éligibilité</th></tr></thead>
        <tbody>${scores.by_region.map(r => `
          <tr><td><strong>${escapeHtml(r.region)}</strong></td><td>${r.moyenne} pts</td><td>${r.eligible}/${r.total}</td><td>${r.taux_eligible}%</td></tr>
        `).join('')}</tbody>
      </table></div>
    `
  }
}

async function renderTerrain() {

    const etat = currentStats.etat
    page.innerHTML = `

      <div class="table-card">
        <div class="table-header"><div class="table-title">Top maladies diagnostiquées</div></div>
        <table><thead><tr><th>Maladie</th><th>Diagnostics</th><th>Urgence</th><th>Cultures touchées</th></tr></thead>
        <tbody>${etat.maladies.map(m => `
          <tr><td><strong>${escapeHtml(m.name)}</strong></td><td>${m.count}</td><td><span class="badge ${m.urgency === 'Élevée' ? 'badge-red' : 'badge-amber'}">${m.urgency}</span></span></td><td class="td-muted">${m.cultures.join(', ')}</span></td>
        `).join('')}</tbody>
      </table></div>
    `
  } else if (currentPartner.role === 'ong' && currentStats.ong) {
    const ong = currentStats.ong
    page.innerHTML = `
      <div class="page-header"><div class="page-title">Données terrain par région</div><div class="page-sub">Cultures et maladies par zone</div></div>
      <div class="charts-grid">
        <div class="chart-card"><div class="chart-title">Cultures par région</div><div class="chart-wrap"><canvas id="chartCulturesRegion"></canvas></div></div>
        <div class="chart-card"><div class="chart-title">Maladies par région</div><div class="chart-wrap"><canvas id="chartMaladiesRegion"></canvas></div></div>
      </div>
    `
    const regions = Object.keys(ong.cultures_by_region || {})
    if (regions.length > 0 && allCharts.culturesRegion) allCharts.culturesRegion.destroy()
    if (regions.length > 0) {
      const topCultures = {}
      Object.values(ong.cultures_by_region).forEach(regionCultures => {
        Object.entries(regionCultures).forEach(([name, count]) => {
          topCultures[name] = (topCultures[name] || 0) + count
        })
      })
      allCharts.culturesRegion = new Chart(document.getElementById('chartCulturesRegion'), {
        type: 'bar',
        data: { labels: Object.keys(topCultures).slice(0,7), datasets: [{ data: Object.values(topCultures).slice(0,7), backgroundColor: '#36AF3B' }] }
      })
    }
  }
}

// ════════════════════════════════════════════════════════════════════
// EXPORTS
// ════════════════════════════════════════════════════════════════════
function exportCreditCSV() {
  if (!currentStats?.microfinance) return
  const users = currentStats.microfinance.users || []
  const csv = [['Nom','Téléphone','Score','Statut','Région','Province','Régularité','Dernière activité'],
    ...users.map(u => [u.first_name + ' ' + u.last_name, u.phone_number, u.score, u.statut, u.region, u.province, u.regularite + '%', new Date(u.derniere_activite).toLocaleDateString()])
  ].map(r => r.join(';')).join('\n')
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob(['\uFEFF' + csv], { type: 'text/csv' }))
  a.download = `credits_${new Date().toISOString().slice(0,10)}.csv`
  a.click()
}
