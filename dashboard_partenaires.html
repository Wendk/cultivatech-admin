<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CultivaTech — Portail Partenaires</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --vert:#1A5319; --vert2:#36AF3B; --vert-pale:#D6EFD8; --vert-bg:#F4FAF4;
    --or:#C8A84B; --bg:#F8FAF8; --card:#FFFFFF;
    --border:#E4EDE4; --text:#1A2E1A; --muted:#6B8F6B;
    --red:#C0392B; --amber:#D68910; --blue:#2471A3; --purple:#7D3C98;
    --shadow:0 1px 3px rgba(26,83,25,.08),0 4px 16px rgba(26,83,25,.06);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

  /* ── LOGIN ── */
  #loginScreen{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#0D1F0D 0%,#1A5319 40%,#024B2A 100%);display:flex;align-items:center;justify-content:center}
  .login-dots{position:absolute;inset:0;opacity:.04;background-image:radial-gradient(circle at 2px 2px,#fff 1px,transparent 0);background-size:28px 28px}
  .login-card{position:relative;background:rgba(255,255,255,.07);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:48px 44px;width:420px;text-align:center}
  .login-logo{font-family:'Playfair Display',serif;font-size:30px;color:#fff;letter-spacing:-.5px}
  .login-sub{color:rgba(255,255,255,.45);font-size:12px;margin:4px 0 6px}
  .login-badge{display:inline-block;background:rgba(54,175,59,.2);border:1px solid rgba(54,175,59,.4);color:var(--vert2);font-size:10px;font-weight:600;padding:3px 12px;border-radius:20px;margin-bottom:28px;letter-spacing:.6px;text-transform:uppercase}
  .role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
  .role-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 6px;color:rgba(255,255,255,.55);font-size:11px;font-weight:500;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;text-align:center}
  .role-btn:hover{border-color:rgba(54,175,59,.5);color:var(--vert2)}
  .role-btn.active{background:rgba(54,175,59,.15);border-color:var(--vert2);color:var(--vert2)}
  .role-icon{font-size:20px;display:block;margin-bottom:4px}
  .login-input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:13px 16px;color:#fff;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:10px;transition:border .2s}
  .login-input::placeholder{color:rgba(255,255,255,.3)}
  .login-input:focus{border-color:var(--vert2)}
  .login-btn{width:100%;background:var(--vert2);border:none;border-radius:12px;padding:14px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;margin-top:4px}
  .login-btn:hover{background:#2d9e32;transform:translateY(-1px)}
  .login-btn:disabled{opacity:.6;transform:none;cursor:not-allowed}
  .login-error{color:#ff7675;font-size:12px;margin-top:10px;min-height:18px}

  /* ── APP ── */
  #app{display:none;min-height:100vh}

  /* ── TOPBAR ── */
  .topbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border);height:60px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
  .topbar-left{display:flex;align-items:center;gap:14px}
  .topbar-logo{font-family:'Playfair Display',serif;font-size:18px;color:var(--vert)}
  .topbar-sep{width:1px;height:20px;background:var(--border)}
  .topbar-role{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .badge-ong{background:#E8F5E9;color:var(--vert)}
  .badge-microfinance{background:#E3F2FD;color:var(--blue)}
  .badge-etat{background:#FFF8E1;color:#B7770D}
  .topbar-name{font-size:13px;color:var(--muted)}
  .topbar-right{display:flex;align-items:center;gap:12px}
  .topbar-region{font-size:12px;color:var(--muted)}
  .logout-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 14px;color:var(--muted);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
  .logout-btn:hover{border-color:var(--red);color:var(--red)}

  /* ── TABS ── */
  .tab-bar{background:#fff;border-bottom:1px solid var(--border);padding:0 32px;display:flex}
  .tab-btn{background:none;border:none;border-bottom:2px solid transparent;padding:14px 20px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;display:flex;align-items:center;gap:6px}
  .tab-btn:hover{color:var(--vert)}
  .tab-btn.active{color:var(--vert);border-bottom-color:var(--vert2);font-weight:600}

  /* ── CONTENT ── */
  .content{padding:32px;max-width:1280px;margin:0 auto}
  .section-title{font-family:'Playfair Display',serif;font-size:22px;color:var(--vert);margin-bottom:4px}
  .section-sub{font-size:13px;color:var(--muted);margin-bottom:24px}

  /* ── KPI CARDS ── */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
  .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--vert2)}
  .kpi-icon{font-size:22px}
  .kpi-value{font-size:28px;font-weight:700;color:var(--vert);letter-spacing:-1px}
  .kpi-label{font-size:12px;color:var(--muted);font-weight:500}
  .kpi-blue .kpi-value{color:var(--blue)}
  .kpi-blue{border-top-color:var(--blue)}
  .kpi-amber .kpi-value{color:var(--amber)}
  .kpi-amber{border-top-color:var(--amber)}
  .kpi-purple .kpi-value{color:var(--purple)}
  .kpi-purple{border-top-color:var(--purple)}

  /* ── CHARTS ── */
  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
  .charts-full{grid-template-columns:1fr}
  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
  .chart-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:16px}
  .chart-wrap{position:relative;height:260px}

  /* ── TABLES ── */
  .table-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:24px}
  .table-head{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
  .table-title{font-size:14px;font-weight:600;color:var(--text)}
  .table-actions{display:flex;gap:8px;align-items:center}
  .search-input{border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none;color:var(--text);width:220px;transition:border .2s}
  .search-input:focus{border-color:var(--vert2)}
  table{width:100%;border-collapse:collapse}
  th{background:var(--vert-bg);padding:10px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  td{padding:11px 16px;font-size:13px;border-top:1px solid var(--border)}
  tr:hover td{background:var(--vert-bg)}
  .table-foot{padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);background:var(--vert-bg)}
  .table-info{font-size:12px;color:var(--muted)}
  .pagination{display:flex;gap:4px}
  .page-btn{border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;background:#fff;font-family:'DM Sans',sans-serif;color:var(--text);transition:all .15s}
  .page-btn.active{background:var(--vert2);color:#fff;border-color:var(--vert2)}
  .page-btn:hover:not(.active){border-color:var(--vert2)}
  .page-btn:disabled{cursor:default}

  /* ── BADGES ── */
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .b-green{background:#E8F5E9;color:var(--vert)}
  .b-amber{background:#FFF3CD;color:#856404}
  .b-red{background:#FDECEA;color:var(--red)}
  .b-blue{background:#E3F2FD;color:var(--blue)}
  .b-gray{background:#F5F5F5;color:#555}

  /* ── SCORE BAR ── */
  .score-row{display:flex;align-items:center;gap:8px}
  .score-bar{height:6px;border-radius:3px;background:var(--border);flex:1;overflow:hidden}
  .score-fill{height:100%;border-radius:3px;transition:width .4s}
  .score-num{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);min-width:32px;text-align:right}

  /* ── STATES ── */
  .loading{text-align:center;padding:64px;color:var(--muted)}
  .spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--vert2);border-radius:50%;animation:spin .6s linear infinite;margin-bottom:12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty-state{text-align:center;padding:48px;color:var(--muted)}
  .empty-icon{font-size:36px;margin-bottom:12px}
  .upcoming{background:linear-gradient(135deg,#F0F9F0,#E8F5E9);border:1px dashed var(--vert2);border-radius:16px;padding:48px;text-align:center;color:var(--vert)}
  .upcoming-icon{font-size:40px;margin-bottom:14px}
  .upcoming-title{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:8px}
  .upcoming-sub{font-size:13px;color:var(--muted)}
  .btn-outline{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .2s;display:flex;align-items:center;gap:5px}
  .btn-outline:hover{border-color:var(--vert2);color:var(--vert)}
  .privacy-notice{background:#FFF3CD;border:1px solid #FFECB3;border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:12px;color:#856404;display:flex;align-items:center;gap:8px}

  @media(max-width:768px){
    .charts-grid{grid-template-columns:1fr}
    .kpi-grid{grid-template-columns:repeat(2,1fr)}
    .content{padding:16px}
    .topbar{padding:0 16px}
  }
</style>
</head>
<body>

<!-- ═══════ LOGIN ═══════ -->
<div id="loginScreen">
  <div class="login-dots"></div>
  <div class="login-card">
    <div class="login-logo">🌱 CultivaTech</div>
    <div class="login-sub">Agriculture intelligente au Burkina Faso</div>
    <div class="login-badge">Portail Partenaires</div>

    <div class="role-grid">
      <button class="role-btn" data-role="ong" onclick="selectRole('ong')">
        <span class="role-icon">🤝</span>ONG
      </button>
      <button class="role-btn" data-role="microfinance" onclick="selectRole('microfinance')">
        <span class="role-icon">🏦</span>Microfinance
      </button>
      <button class="role-btn" data-role="etat" onclick="selectRole('etat')">
        <span class="role-icon">🏛️</span>État
      </button>
    </div>

    <input class="login-input" id="username" type="text" placeholder="Identifiant" autocomplete="username">
    <input class="login-input" id="password" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="login-btn" id="loginBtn" onclick="doLogin()" disabled>Se connecter</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ═══════ APP ═══════ -->
<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">🌱 CultivaTech</span>
      <div class="topbar-sep"></div>
      <span id="roleBadge" class="topbar-role"></span>
      <span id="topbarName" class="topbar-name"></span>
    </div>
    <div class="topbar-right">
      <span id="topbarRegion" class="topbar-region"></span>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <nav class="tab-bar" id="tabBar"></nav>
  <main class="content" id="mainContent">
    <div class="loading"><div class="spinner"></div><div>Chargement…</div></div>
  </main>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// CONFIG — adapter l'URL si tu changes de projet Supabase
// ══════════════════════════════════════════════════════════════════════════════
const FUNCTIONS_URL = 'https://vyqhzagajlbosikzfnit.supabase.co/functions/v1'

// ══════════════════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════════════════
let TOKEN        = sessionStorage.getItem('partner_token')
let USER         = JSON.parse(sessionStorage.getItem('partner_user') || 'null')
let DATA         = null
let CHARTS       = {}
let selectedRole = null
let currentTab   = null
let filteredRows = []
let currentPage  = 1
const PAGE_SIZE  = 15

// ══════════════════════════════════════════════════════════════════════════════
// BOOT — restaurer la session si token présent
// ══════════════════════════════════════════════════════════════════════════════
if (TOKEN && USER) { showApp(); fetchAndRender() }

// ══════════════════════════════════════════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════════════════════════════════════════
function selectRole(role) {
  selectedRole = role
  document.querySelectorAll('.role-btn').forEach(b => b.classList.toggle('active', b.dataset.role === role))
  document.getElementById('loginBtn').disabled = false
}

async function doLogin() {
  const username = document.getElementById('username').value.trim()
  const password = document.getElementById('password').value
  const errEl    = document.getElementById('loginError')
  errEl.textContent = ''

  if (!selectedRole) { errEl.textContent = 'Veuillez sélectionner un rôle.'; return }
  if (!username || !password) { errEl.textContent = 'Identifiant et mot de passe requis.'; return }

  const btn = document.getElementById('loginBtn')
  btn.textContent = 'Connexion…'; btn.disabled = true

  try {
    const res  = await fetch(`${FUNCTIONS_URL}/partner-login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, role: selectedRole })
    })
    const data = await res.json()

    if (!res.ok) {
      errEl.textContent = data.error || 'Identifiants incorrects.'
      btn.textContent = 'Se connecter'; btn.disabled = false
      return
    }

    // data.user = { id, username, name, role, region, tabs }
    TOKEN = data.token
    USER  = data.user
    sessionStorage.setItem('partner_token', TOKEN)
    sessionStorage.setItem('partner_user', JSON.stringify(USER))

    showApp()
    await fetchAndRender()
  } catch (_) {
    errEl.textContent = 'Erreur réseau. Vérifiez votre connexion.'
    btn.textContent = 'Se connecter'; btn.disabled = false
  }
}

document.getElementById('username').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus()
})
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin()
})

// ══════════════════════════════════════════════════════════════════════════════
// APP INIT
// ══════════════════════════════════════════════════════════════════════════════
function showApp() {
  document.getElementById('loginScreen').style.display = 'none'
  document.getElementById('app').style.display = 'block'

  const ROLE_LABEL = { ong:'🤝 ONG', microfinance:'🏦 Microfinance', etat:'🏛️ État' }
  const ROLE_CLS   = { ong:'badge-ong', microfinance:'badge-microfinance', etat:'badge-etat' }

  const badge = document.getElementById('roleBadge')
  badge.textContent = ROLE_LABEL[USER.role] || USER.role
  badge.className = `topbar-role ${ROLE_CLS[USER.role] || ''}`
  document.getElementById('topbarName').textContent = USER.name
  document.getElementById('topbarRegion').textContent = `📍 ${USER.region || 'National'}`

  buildTabBar()
}

// ─── Tabs ───────────────────────────────────────────────────────────────────
const TAB_META = {
  overview:    { icon:'📊', label:"Vue d'ensemble" },
  terrain:     { icon:'🌾', label:'Terrain' },
  formations:  { icon:'🎓', label:'Formations' },
  credit:      { icon:'💳', label:'Crédit agricole' },
  productions: { icon:'📦', label:'Productions' },
}

function buildTabBar() {
  const bar  = document.getElementById('tabBar')
  bar.innerHTML = ''
  const tabs = USER.tabs || ['overview']
  tabs.forEach((t, i) => {
    const btn = document.createElement('button')
    btn.className = `tab-btn${i === 0 ? ' active' : ''}`
    btn.dataset.tab = t
    btn.onclick = () => switchTab(t)
    const m = TAB_META[t] || { icon:'•', label:t }
    btn.innerHTML = `${m.icon} ${m.label}`
    bar.appendChild(btn)
  })
  currentTab = tabs[0]
}

function switchTab(tab) {
  currentTab = tab
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab))
  if (DATA) { killCharts(); renderCurrentTab() }
}

// ══════════════════════════════════════════════════════════════════════════════
// DATA FETCH
// ══════════════════════════════════════════════════════════════════════════════
async function fetchAndRender() {
  document.getElementById('mainContent').innerHTML =
    '<div class="loading"><div class="spinner"></div><div>Chargement des données…</div></div>'

  try {
    const res = await fetch(`${FUNCTIONS_URL}/get-partner-stats`, {
      headers: { 'Authorization': `Bearer ${TOKEN}` }
    })
    if (res.status === 401) { logout(); return }
    if (!res.ok) throw new Error(`HTTP ${res.status}`)

    DATA = await res.json()
    killCharts()
    renderCurrentTab()
  } catch (e) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div style="margin-bottom:12px">Impossible de charger les données.<br><small style="color:var(--muted)">${e.message}</small></div>
        <button onclick="fetchAndRender()" class="btn-outline" style="margin:0 auto">↺ Réessayer</button>
      </div>`
  }
}

function renderCurrentTab() {
  const MAP = {
    overview:    renderOverview,
    terrain:     renderTerrain,
    formations:  renderFormations,
    credit:      renderCredit,
    productions: renderProductions,
  }
  ;(MAP[currentTab] || renderOverview)()
}

// ══════════════════════════════════════════════════════════════════════════════
// CHART HELPERS
// ══════════════════════════════════════════════════════════════════════════════
function killCharts() {
  Object.values(CHARTS).forEach(c => { try { c.destroy() } catch(_){} })
  CHARTS = {}
}

function mkChart(id, cfg) {
  const el = document.getElementById(id)
  if (!el) return null
  try { Chart.getChart(el)?.destroy() } catch(_){}
  CHARTS[id] = new Chart(el, cfg)
  return CHARTS[id]
}

function axisOpts({ max, legend=true, stacked=false } = {}) {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display:legend, position:'bottom', labels:{ font:{ family:'DM Sans' }, boxWidth:12 } } },
    scales: {
      x: { stacked, grid:{ display:false }, ticks:{ font:{ family:'DM Sans', size:11 } } },
      y: { stacked, beginAtZero:true, max, grid:{ color:'#f0f0f0' }, ticks:{ font:{ family:'DM Sans', size:11 } } }
    }
  }
}

const GREEN_PALETTE = n => Array.from({length:n}, (_,i) => `hsl(${125+i*14},${55-i}%,${42+i*2}%)`)

// ══════════════════════════════════════════════════════════════════════════════
// OVERVIEW — commun à tous les rôles
// ══════════════════════════════════════════════════════════════════════════════
function renderOverview() {
  const k    = DATA.kpis || {}
  const role = USER.role

  let extra = ''
  if (role === 'ong' && DATA.ong?.scores?.global) {
    const g = DATA.ong.scores.global
    extra = `
      <div class="kpi-card kpi-blue">
        <div class="kpi-icon">✅</div>
        <div class="kpi-value">${fmt(g.eligible)}</div>
        <div class="kpi-label">Éligibles crédit</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">⭐</div>
        <div class="kpi-value">${g.moyenne ?? '—'}<small style="font-size:14px">/100</small></div>
        <div class="kpi-label">Score agricole moyen</div>
      </div>`
  }
  if (role === 'microfinance' && DATA.microfinance?.stats) {
    const s    = DATA.microfinance.stats
    const taux = s.total ? Math.round(s.eligible / s.total * 100) : 0
    extra = `
      <div class="kpi-card kpi-blue">
        <div class="kpi-icon">✅</div>
        <div class="kpi-value">${fmt(s.eligible)}</div>
        <div class="kpi-label">Éligibles crédit</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">⭐</div>
        <div class="kpi-value">${s.score_moyen ?? '—'}<small style="font-size:14px">/100</small></div>
        <div class="kpi-label">Score moyen</div>
      </div>
      <div class="kpi-card kpi-amber">
        <div class="kpi-icon">📈</div>
        <div class="kpi-value">${taux}<small style="font-size:16px">%</small></div>
        <div class="kpi-label">Taux d'éligibilité</div>
      </div>`
  }

  document.getElementById('mainContent').innerHTML = `
    <h2 class="section-title">Vue d'ensemble</h2>

// Données: DATA.ong.scores.global, DATA.ong.scores.by_region, DATA.ong.cultures_by_region
function renderTerrainOng() {
  const ong      = DATA.ong || {}
  const scores   = ong.scores || { global:{}, by_region:[] }
  const cultMap  = ong.cultures_by_region || {}
  const regions  = [...(scores.by_region || [])].sort((a,b) => b.moyenne - a.moyenne).slice(0, 10)

  // Aplatir cultures_by_region → totaux globaux
  const totals = {}
  Object.values(cultMap).forEach(rc =>
    Object.entries(rc).forEach(([c, n]) => { totals[c] = (totals[c]||0) + n })

  const topCults = Object.entries(totals).sort((a,b) => b[1]-a[1]).slice(0, 10)

  document.getElementById('mainContent').innerHTML = `
    <h2 class="section-title">Terrain agricole</h2>
    <p class="section-sub">Scores agricoles, éligibilité crédit et cultures par région</p>

    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);max-width:560px;margin-bottom:28px">

        <div class="kpi-icon">👨‍🌾</div>

      </div>

      </div>
      <div class="kpi-card">
        <div class="kpi-icon">⭐</div>
        <div class="kpi-value">${scores.global?.moyenne ?? '—'}</div>
        <div class="kpi-label">Score moyen /100</div>
      </div>
    </div>

    <div class="charts-grid" style="margin-bottom:24px">
      <div class="chart-card">
        <div class="chart-title">Score moyen par région</div>
        <div class="chart-wrap"><canvas id="cScoreReg"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Taux d'éligibilité crédit par région (%)</div>
        <div class="chart-wrap"><canvas id="cEligReg"></canvas></div>
      </div>
    </div>

    <div class="charts-grid charts-full">
      <div class="chart-card">
        <div class="chart-title">Top 10 cultures pratiquées (toutes régions)</div>
        <div class="chart-wrap" style="height:230px"><canvas id="cCultsOng"></canvas></div>
      </div>
    </div>

    ${regions.length === 0 ? `
    <div class="empty-state" style="margin-top:8px">

      <div style="font-size:12px;margin-top:6px">Les régions s'afficheront dès que les utilisateurs renseignent leur localisation.</div>
    </div>` : ''}
  `

  setTimeout(() => {
    if (regions.length) {
      mkChart('cScoreReg', {
        type:'bar',
        data:{ labels:regions.map(r=>r.region),
          datasets:[{ label:'Score moyen', data:regions.map(r=>r.moyenne), backgroundColor:'#36AF3B', borderRadius:6 }] },
        options:axisOpts({ max:100, legend:false })
      })
      mkChart('cEligReg', {
        type:'bar',
        data:{ labels:regions.map(r=>r.region),
          datasets:[{ label:'Taux (%)', data:regions.map(r=>r.taux_eligible), backgroundColor:'#2471A3', borderRadius:6 }] },

function renderCredit() {

    <p class="section-sub">Analyse de solvabilité basée sur le comportement et les pratiques agricoles</p>

        <div class="kpi-icon">👨‍🌾</div>

        <div class="kpi-label">Agriculteurs évalués</div>
      </div>
      <div class="kpi-card kpi-blue">
        <div class="kpi-icon">✅</div>
        <div class="kpi-value">${fmt(stats.eligible)}</div>
        <div class="kpi-label">Éligibles crédit</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">⭐</div>

        <div class="kpi-label">Score moyen</div>
      </div>
      <div class="kpi-card kpi-amber">
        <div class="kpi-icon">📈</div>
        <div class="kpi-value">${taux}<small style="font-size:16px">%</small></div>
        <div class="kpi-label">Taux d'éligibilité</div>
      </div>
    </div>

    <div class="charts-grid" style="margin-bottom:24px">
      <div class="chart-card">
        <div class="chart-title">Distribution des scores agricoles</div>
        <div class="chart-wrap"><canvas id="cDist"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Statut de crédit</div>
        <div class="chart-wrap"><canvas id="cStatut"></canvas></div>
      </div>
    </div>

    <div class="privacy-notice">
      🔒 <strong>Données confidentielles</strong> — Réservées à l'évaluation interne du crédit agricole. Toute divulgation externe est proscrite.
    </div>

    <div class="table-card">
      <div class="table-head">
        <span class="table-title">🌾 Agriculteurs (${users.length})</span>
        <div class="table-actions">
          <input type="text" class="search-input" id="searchInput" placeholder="Nom ou téléphone…" oninput="searchCredit(this.value)">
          <button class="btn-outline" onclick="exportCSV()">⬇️ Exporter CSV</button>
        </div>
      </div>
      <table>
        <thead><tr>
          <th>Nom</th><th>Téléphone</th><th>Score</th><th>Statut</th><th>Région</th><th>Province</th><th>Inscription</th>
        </tr></thead>
        <tbody id="creditBody"></tbody>
      </table>
      <div class="table-foot">
        <span class="table-info" id="tblInfo"></span>

function renderCreditTable() {
  const total = filteredRows.length
  const pages = Math.ceil(total / PAGE_SIZE) || 1
  currentPage = Math.min(currentPage, pages)
  const slice = filteredRows.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE)

  document.getElementById('creditBody').innerHTML = slice.length === 0
    ? `<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--muted)">Aucun résultat</td></tr>`
    : slice.map(u => {
        const sc  = u.score || 0
        const col = sc >= 61 ? 'var(--vert2)' : sc >= 41 ? 'var(--amber)' : 'var(--red)'
        return `<tr>
          <td><strong>${esc(u.first_name||'')} ${esc(u.last_name||'')}</strong></td>
          <td style="font-family:'DM Mono',monospace;font-size:12px">${esc(u.phone_number||'—')}</td>
          <td>
            <div class="score-row">
              <div class="score-bar"><div class="score-fill" style="width:${sc}%;background:${col}"></div></div>
              <span class="score-num">${sc}</span>
            </div>
          </td>
          <td>${statutBadge(u.statut)}</td>
          <td style="font-size:12px;color:var(--muted)">${esc(u.region||'—')}</td>
          <td style="font-size:12px;color:var(--muted)">${esc(u.province||'—')}</td>
          <td style="font-size:12px;color:var(--muted)">${fmtYear(u.date_inscription)}</td>
        </tr>`
      }).join('')

  document.getElementById('tblInfo').textContent =
    `${total} résultat${total>1?'s':''} — page ${currentPage}/${pages}`

  const pag = document.getElementById('tblPag')
  pag.innerHTML = ''
  const addBtn = (label, page, active) => {
    const b = document.createElement('button')
    b.className = `page-btn${active?' active':''}`
    b.textContent = label
    b.onclick = () => { currentPage = page; renderCreditTable() }
    if (active) b.disabled = true
    pag.appendChild(b)
  }
  if (currentPage > 1) addBtn('‹', currentPage-1, false)
  for (let p = Math.max(1,currentPage-2); p <= Math.min(pages,currentPage+2); p++) addBtn(p, p, p===currentPage)
  if (currentPage < pages) addBtn('›', currentPage+1, false)
}

function searchCredit(q) {
  const all = DATA.microfinance?.users || []
  const lq  = q.toLowerCase()
  filteredRows = lq
    ? all.filter(u =>
        `${u.first_name||''} ${u.last_name||''}`.toLowerCase().includes(lq) ||
        (u.phone_number||'').includes(lq))
    : [...all]
  currentPage = 1
  renderCreditTable()
}

function exportCSV() {
  const rows = DATA.microfinance?.users || []
  const BOM  = '﻿'
  const HDR  = ['Prénom','Nom','Téléphone','Score','Statut','Région','Province','Inscription']
  const body = rows.map(u => [
    u.first_name, u.last_name, u.phone_number,
    u.score, u.statut, u.region, u.province,
    u.date_inscription ? new Date(u.date_inscription).toLocaleDateString('fr-FR') : ''
  ])
  const csv = BOM + [HDR,...body]
    .map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(';'))
    .join('\n')
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }))
  a.download = `cultivatech_credit_${new Date().toISOString().slice(0,10)}.csv`
  a.click()
}

// UTILS
// ══════════════════════════════════════════════════════════════════════════════
function fmt(n)      { return n != null ? Number(n).toLocaleString('fr-FR') : '—' }
function fmtDate(iso){ return iso ? new Date(iso).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}) : '—' }
function fmtYear(iso){ return iso ? new Date(iso).getFullYear() : '—' }
function esc(s)      { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function urgBadge(u) {
  const m = { 'Élevée':'b-red', 'Modérée':'b-amber', 'Faible':'b-green' }
  return `<span class="badge ${m[u]||'b-gray'}">${esc(u||'—')}</span>`
}
function statutBadge(s) {
  const m = { 'Éligible crédit':'b-green', 'À évaluer':'b-amber', 'Insuffisant':'b-red' }
  return `<span class="badge ${m[s]||'b-gray'}">${esc(s||'Non évalué')}</span>`
}
